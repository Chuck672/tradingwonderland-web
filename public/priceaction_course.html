If you see a vacuum at the origin of a structure, it is a signal of extreme accumulation urgency—it will NEVER give you a deep pullback! But if that vacuum happens as a final sprint after a long rally, it is a death trap manufactured by smart money pulling liquidity. The exact same vacuum: at the origin it's a goldmine, at the terminal it's a crematorium!`}},{id:"m5-s12",title:{zh:"实盘图解：推移型真空 (起爆点)",en:"Chart: Displacement Void (Ignition)"},chartData:JE,annotations:e6,bullets:{zh:[],en:[]},script:{zh:"这是一种狂暴的统治力！主力根本不打算和任何人讨价还价，直接一飞冲天，留下一个恐怖的真空带。散户挂着底部的单子天天盼着深调。你看它调了吗？它仅仅在真空带最边缘蹭了一下，留下一根长长的拒绝下影线，立刻继续疯长！这就是我说的，起点的真空代表绝对控制权，你敢等深调，你就只能看它绝尘而去！",en:"This is savage dominance! Smart money has zero intention of negotiating; they launch it straight to the moon, leaving a terrifying vacuum zone. Retail places orders at the bottom praying for a deep retrace. Did it retrace? It barely brushed the very edge of the void, left a massive rejection wick, and instantly resumed its psychotic rally! This is what I mean: an origin vacuum is absolute control. If you wait for a deep retrace, you'll just watch it disappear into the horizon!"}},{id:"m5-s13",title:{zh:"实盘图解：衰竭型真空 (埋骨地)",en:"Chart: Exhaustion Void (Graveyard)"},chartData:t6,annotations:n6,bullets:{zh:[],en:[]},script:{zh:"感受一下什么叫绝望！在长期上涨的末端，价格突然像疯狗一样拔高，拉出了这辈子最大的一根阳线真空。追高的散户眼都红了。结果下一秒，瀑布！没有一丝丝抵抗，这根所谓的无敌大阳线被瞬间全部吞没填平。这就是衰竭！这根K线里全都是爆仓单和无脑追价单的枯骨。记住，经不起回补的巨阳线，都是垃圾！",en:"Feel the despair! At the tail end of a long uptrend, price suddenly spikes like a rabid dog, printing the biggest green vacuum of its life. FOMO retail traders are seeing red. The very next second: Waterfall! With absolutely zero resistance, this supposedly invincible green candle gets instantly engulfed and filled. That is Exhaustion! That candle is made entirely of the bones of liquidated shorts and mindless market buyers. Remember, a giant candle that can't withstand a retest is pure garbage!"}},{id:"m5-s14",title:{zh:"Module 5 核心结论：撕下假面具",en:"Module 5 Conclusions: Tear Off the Mask"},diagram:"disp-vs-exh-summary",bullets:{zh:["永远不要被图表上的瞬间爆发骗了，用 3 秒法过滤！","第一秒问位置：是起点还是终点？","第二秒问接受：突破后是站稳还是秒怂？","第三秒问延续：有没有凶狠的第二段跟进？","真正值得你拔刀的，是清扫流动性后、带真空缺口且严密防守的真推移！"],en:["Never get fooled by momentary chart explosions. Filter with the 3-Second Rule!","Sec 1 (Location): Is it the start or the end?","Sec 2 (Acceptance): Does it hold the break or instantly piss its pants?","Sec 3 (Follow-through): Is there a vicious second leg?","The only move worth drawing your sword for is a true displacement after a sweep, defended fiercely!"]},script:{zh:"这一章结束，我希望你们的眼睛变成X光机！以后再看到大阳线大阴线突破，不要像狗看到骨头一样扑上去。停下来，用 3 秒钟拷问它：你是在起跑，还是在赴死？你敢不敢在突破口站稳？如果你是个一碰就碎的衰竭假动作，对不起，老子反手就把你做空到破产！控制住你的手，只做真正的 Displacement！",en:"As this module wraps, I want your eyes to become X-ray machines! From now on, when you see giant candles breaking out, do not lunge at it like a dog at a bone. STOP, and interrogate it for 3 seconds: Are you starting a race, or running to your death? Do you have the guts to hold the breach? If you are a fragile, fake exhaustion move, I will short you into bankruptcy! Control your hands, only trade true Displacement!"}}]},{id:"m6",title:{zh:"Module 6: Induction Phase",en:"Module 6: Induction Phase"},slides:[{id:"m6-s1",title:{zh:"Module 6 — Induction Phase（归纳阶段）",en:"Module 6 — Induction Phase"},diagram:"induction-title",bullets:{zh:["机构建仓必经的 3 个阶段，99%散户在第 2 阶段被干掉","真正的趋势启动前，市场通常先完成一轮“诱导—吸流动性—控制权切换”"],en:["The 3 mandatory stages of institutional accumulation. 99% of retail dies in Stage 2.",'Before the real trend begins, the market completes an "Induction—Liquidity Sweep—Control Shift" cycle.']},script:{zh:"听好了，机构不是在你看到机会的那一刻才开始做事的。真正的大行情，往往在你看见第一个漂亮形态之前，甚至就在设计你的预期。这根本不是机会，这是给你量身定制的坟墓。",en:"Listen up, institutions don't start working when you see the opportunity. The real massive move is designing your expectations long before you see the first textbook setup."}},{id:"m6-s2",title:{zh:"什么是 Induction Phase",en:"What is the Induction Phase"},diagram:"induction-definition",bullets:{zh:["不是趋势本身，而是趋势启动前的“条件塑造过程”","市场在真正单边推进前，先通过结构、假动作、陷阱","把足够多的参与者“归纳”到某个错误预期中","同时完成所需的对手盘获取和仓位准备","核心结论：真正的大 move，不是从“确认”开始，而是从“诱导别人确认错方向”开始"],en:['Not the trend itself, but the "condition shaping process" before it begins.',"Using fakeouts, traps, and fake structures before the real push.","Inducing enough participants into a wrong narrative.","Acquiring necessary counter-party liquidity for their core positions.","Conclusion: Real moves don't start with confirmation; they start by inducing others to confirm the WRONG direction."]},script:{zh:"Induction（归纳）不是一个神棍名词。它是流动性、陷阱、失败形态的终极总称。大资金在真正推价前，必须把你“归纳”到一个错误的剧本里。让你觉得自己是对的，然后心甘情愿地把筹码交出来。",en:"Induction is not a mystical term. It is the ultimate term for liquidity, traps, and failed setups. Before pushing the price, big money must induce you into a wrong narrative. Make you feel you are right, so you willingly hand over your bags."}},{id:"m6-s3",title:{zh:"为什么大多数散户总死在启动前",en:"Why Retail Always Dies Before the Launch"},diagram:"retail-death",bullets:{zh:["因为他们把“准备阶段”误认为“已经启动”","看到教科书级别的形态就急着重仓进场","把归纳阶段的 诱导 FVG / 假突破 / 假结构破坏 当成真机会","完全忽略了市场其实仍在“收单、换手、洗仓”"],en:['Because they mistake the "preparation phase" for the "launch".',"Fomoing into textbook setups immediately.","Treating Inducement FVGs / Fakeouts / Fake CHOCHs as true opportunities.",'Completely ignoring that the market is still in "accumulation and wash-out mode".']},script:{zh:"你们很多人为什么明明方向最后是对的，结果还是爆仓？因为你们参与的是诱导段、洗仓段！市场杀的不是方向看错的白痴，市场先杀的是“方向也许对，但时机太早”的自作聪明的散户。",en:`Why do you blow up even when your direction is eventually right? Because you participate in the inducement and wash-out phases! The market doesn't just kill idiots with the wrong direction; it first slaughters the "smart" money that gets the direction right but the timing way too early.`}},{id:"m6-s4",title:{zh:"Induction Phase 的 3 个典型阶段",en:"The 3 Typical Stages of Induction"},diagram:"induction-3-stages",bullets:{zh:["Stage 1 — Setup Creation (环境塑造 / 预期铺垫)","Stage 2 — Inducement & Sweep (诱导与清算)","Stage 3 — Commitment Move (真实承诺性推动)","第 1 阶段让你“看见机会”，第 2 阶段让你“死在机会里”，第 3 阶段才是机构真正发力的时候"],en:["Stage 1 — Setup Creation (Building the Narrative)","Stage 2 — Inducement & Sweep (Trapping & Purging)","Stage 3 — Commitment Move (The Real Expansion)","Stage 1 makes you see the opportunity. Stage 2 kills you in it. Stage 3 is when institutions actually move the price."]},script:{zh:"把这三个阶段刻在脑子里。第一阶段搭戏台，第二阶段杀猪，第三阶段收网走人。如果你分不清现在是第几阶段，你就永远是第二阶段的祭品！",en:"Carve these three stages into your brain. Stage 1 builds the stage, Stage 2 slaughters the pigs, and Stage 3 executes the move. If you can't tell which stage we are in, you are destined to be the sacrifice in Stage 2!"}},{id:"m6-s5",title:{zh:"Stage 1：环境塑造 / 预期铺垫",en:"Stage 1: Setup Creation"},diagram:"stage1-setup",bullets:{zh:["先把一个“人人看得懂的交易故事”搭出来","形成明显结构，画出完美支撑/阻力，留下极其显眼的 FVG","给市场参与者一个“看起来非常合理”的方向预期","机构首先需要的不是推价格，而是让大众在某个剧本上形成一致性共识"],en:['Build a "trading story everyone understands" first.',"Form obvious structures, perfect support/resistance, and extremely visible FVGs.",'Give participants a "highly logical" directional expectation.',"Institutions don't need to push price yet; they need the masses to form a consensus on a script."]},script:{zh:"这是一个极度反常识的阶段。一个形态越漂亮，越不代表它马上能赚钱！因为它极有可能只是被机构“故意画出来”给大众看的舞台。他们需要你们在这个位置建立多头或空头共识，只有你们上车了，他们才有猎物。",en:"This is extremely counter-intuitive. The more beautiful a setup is, the less likely it will make you money immediately! It is highly likely deliberately painted for the public. They need you to build a consensus here; only when you board the train do they have prey."}},{id:"m6-s6",title:{zh:"实盘图解：Stage 1 漂亮的教科书陷阱",en:"Chart: Stage 1 Beautiful Textbook Trap"},chartData:u6,annotations:c6,bullets:{zh:[],en:[]},script:{zh:"看这张图，多干净的趋势线，多明显的看涨缺口！简直就是教科书里的送分题！散户在这里看得热血沸腾，多头共识无比纯粹。但你要知道，只要更大的深层流动性还没被清扫，这全是他妈的演给你看的假戏！",en:"Look at this chart, what a clean trendline and extremely visible FVG! It's a textbook freebie! Retail is getting excited here, the bullish consensus is pure. But you must know: as long as the deeper macro liquidity hasn't been swept, this is all a f**king staged play!"}},{id:"m6-s7",title:{zh:"Stage 2：诱导与清算 (99%死于此)",en:"Stage 2: Inducement & Sweep (99% Die Here)"},diagram:"stage2-inducement",bullets:{zh:["市场先让一批人按刚才铺垫的 textbook 逻辑入场尝点甜头","然后通过深度回撤 (Deeper Pullback)、恶意扫损 (Stop Hunt)、假突破 (Fake Breakout)","把这些错误仓位全部洗出来，把所有的流动性拿到手","真正危险的不是假信号，而是“看起来有足够理由相信的半真信号”"],en:["Market lets early players taste profit based on the Stage 1 textbook logic.","Then uses Deeper Pullbacks, Stop Hunts, and Fake Breakouts.","Washes out all these wrong positions to grab all the liquidity.",`The real danger isn't a fake signal; it's a "half-true signal with enough reasons to believe it".`]},script:{zh:"这就是全篇最核心的地方！第二阶段杀的绝对不是什么都不懂的新手，杀的就是你们这些自以为学了几天机构订单块、觉得这次“绝对看懂了”的老散户。这里出来的信号，长得就像差一点点就对的极品形态，然后一波把你带走！",en:"This is the core of the entire chapter! Stage 2 doesn't kill clueless beginners; it slaughters you veteran retailers who think you mastered Order Blocks. The signals here look like absolute perfection, just to rip your face off!"}},{id:"m6-s8",title:{zh:"Stage 2 的 6 种致命表现形式",en:"6 Fatal Forms of Stage 2"},diagram:"stage2-forms",bullets:{zh:["1. 明显 FVG 回补后给你个小反弹，然后继续深砸","2. 订单块 (OB) 首次触碰有反应，第二次直接被无情贯穿","3. 经典的 Equal Highs / Lows 假突破","4. 趋势线下破扫损后，极速收回","5. 局部出现 CHOCH (结构破坏)，但完全没有后续推移跟进","6. 看似是强力推移 (Displacement)，实则是衰竭冲刺 (Exhaustion)"],en:["1. Obvious FVG gives a small bounce, then dumps deeper.","2. Order Block reacts on first tap, then ruthlessly pierced on the second.","3. Classic Equal Highs/Lows fakeout.","4. Trendline breakdown stop-hunt, then rapid reclaim.","5. Local CHOCH appears but has ZERO follow-through.","6. Looks like violent Displacement, but is actually an Exhaustion spike."]},script:{zh:"你之前学过的所有形态，都可能在第二阶段被“先利用、再兑现”。不是 FVG 错了，也不是 OB 失效了，而是你必须知道，它们有时候只是主力归纳绞肉机链条上的一个诱饵环节。",en:"All the setups you learned before can be utilized and then destroyed in Stage 2. It's not that FVGs are wrong or OBs fail; you must know they are sometimes just a bait link in the smart money inducement meat grinder."}},{id:"m6-s9",title:{zh:"实盘图解：Stage 2 诱导与无情清算",en:"Chart: Stage 2 Trap & Ruthless Purge"},chartData:f6,annotations:d6,bullets:{zh:[],en:[]},script:{zh:"仔细看！价格摸到缺口，给你一个小反弹，散户全仓杀入喊着“回补起飞”。下一根 K 线直接如同断头台一样砸穿前低！把你们的止损全部吃光，完成底部的清算。这时候你们在群里骂娘，但这就是机构的屠宰场，拿到你们的血筹后，真正的暴涨才刚刚开始！",en:'Look closely! Price taps the gap, gives a small bounce, retail goes all-in shouting "to the moon." The next candle acts like a guillotine, smashing through the previous low to eat all your stops! You are cursing in chat rooms, but this is the institutional slaughterhouse. Once they get your blood-soaked chips, the true moonshot begins!'}},{id:"m6-s10",title:{zh:"Stage 3：真实承诺性推动",en:"Stage 3: Commitment Move"},diagram:"stage3-commitment",bullets:{zh:["主要流动性已被彻底清理，错误的早鸟仓位已被洗光","机构终于不再测试和画门，而是真正、干净地推进价格","出现真正的 Displacement (推移)，突破后绝不回头","FVG、OB 的回踩变得极度有效且极浅","核心结论：Stage 3 不再需要反复证明自己！"],en:["Major liquidity has been completely purged, early bird positions washed out.","Institutions stop testing and chopping, and cleanly push the price.","True Displacement appears, never looking back after the break.","FVG/OB retests become incredibly shallow and highly effective.","Conclusion: Stage 3 no longer needs to repeatedly prove itself!"]},script:{zh:"洗盘结束了，筹码拿够了。真正的爆发不需要再犹犹豫豫、来回扎针。真正的大级别推动，结构推进极其干净，回踩极度有效，像热刀切黄油一样切开上方的所有阻力。你只有熬过前面的诱导，活到这个时候，才能吃上大肉！",en:"The wash-out is over, and the chips are gathered. The real breakout doesn't need to hesitate and sweep back and forth. The structure pushes are clean, retests are perfect, slicing through all upper resistance like a hot knife through butter. You only eat the big meat if you survive the inducement and make it here!"}},{id:"m6-s11",title:{zh:"实盘图解：Stage 3 终极承诺推动",en:"Chart: Stage 3 Ultimate Commitment"},chartData:h6,annotations:m6,bullets:{zh:[],en:[]},script:{zh:"看懂了吗？下方深层流动性扫干净后，立刻夺回结构（Reclaim），伴随巨大的强力推移，一骑绝尘。没有任何拖泥带水，留下的缺口仅仅浅浅碰了一下就继续爆拉，完全不给空头解套的机会。这才是真正值得你重仓干的时刻！",en:"Do you see it? After sweeping the deep liquidity at the bottom, it immediately reclaims the structure with massive displacement, leaving everyone behind. No hesitation. The gap left behind is barely tapped before rocketing again, giving zero chance for shorts to escape. THIS is the moment worth going heavy!"}},{id:"m6-s12",title:{zh:"区分 Stage 2 和 Stage 3 的绝杀技巧",en:"The Ultimate Trick to Separate Stage 2 & 3"},diagram:"stage2-vs-3",bullets:{zh:["高手赚的钱，不是看懂 Stage 1，而是分清 2 和 3！","【Stage 2 特征】：结构反复画门，频繁双向扫损，似乎有很多入场机会但一进去就死，推移极不持久。","【Stage 3 特征】：核心大级别的流动性池已经被干破，方向极其单边顺畅，机会数量减少但胜率极高。","不要急着在第一拨信号上表态！"],en:["Pros don't make money recognizing Stage 1; they make it separating 2 and 3!","【Stage 2 Traits】: Choppy structure, frequent 2-way sweeps, lots of fake entries, zero displacement follow-through.","【Stage 3 Traits】: Core macro liquidity pools are already destroyed, direction is smooth and 1-way, fewer setups but ultra-high win rate.","Do NOT commit on the very first signal!"]},script:{zh:"记住，如果图表上两边还在疯狂画门、反复扎针，那就说明第二阶段还在洗！主力还没吃饱！直到一侧的深层止损被彻底扫干净，并且出现不再回头的强力推移，才是真正的第三阶段。让子弹飞一会儿！",en:"Remember, if the chart is still violently sweeping both sides and wicking everywhere, it's still Stage 2 washing out! Smart money isn't full yet! Only when a deep liquidity pool is completely purged and followed by clean, point-of-no-return displacement, is it Stage 3. Let the bullets fly for a bit!"}},{id:"m6-s13",title:{zh:"Induction Phase 的完整拼图",en:"The Complete Induction Puzzle"},diagram:"induction-puzzle",bullets:{zh:["把前 5 个模块的武器全部串起来：","Structure：先搭一个人人看得懂的教科书结构","Liquidity：把散户止损和追价集中到可收割的池子里","OB / FVG：提供虚假的诱导锚点","Disp vs Exh：在关键阶段制造“像真启动”的末端加速","结论：真正的 Move 永远出现在全面清理之后！"],en:["Connecting the weapons from the first 5 modules:","Structure: Build a textbook structure everyone understands.","Liquidity: Concentrate retail stops and breakout orders into harvestable pools.","OB / FVG: Provide fake inducement anchors.",'Disp vs Exh: Create fake "ignition" acceleration to trap momentum traders.',"Conclusion: The real Move ALWAYS happens after the grand purge!"]},script:{zh:"这就是整个交易体系的闭环！结构造势、流动性蓄水、缺口诱导、虚假动能爆发。机构打的是一套组合拳。如果你还是像以前一样，孤立地盯着一根K线或者一个缺口做单，你活不过今晚！",en:"This is the closed loop of the entire system! Structure builds momentum, liquidity stores fuel, gaps induce, and fake momentum exhausts. Institutions fight with a combo. If you still stare at an isolated candle or gap to trade, you won't survive the night!"}},{id:"m6-s14",title:{zh:"实盘判断：我现在看到的是哪一阶段？",en:"Live Judgment: Which Stage am I looking at?"},diagram:"stage-check",bullets:{zh:["拷问 1：Setup 是不是很干净？市场故事很顺？(可能是 Stage 1 铺垫)","拷问 2：刚刚有没有发生双向扫损？突破是不是立刻被砸回？(绝对是 Stage 2 洗仓)","拷问 3：大级别的流动性池扫干净了吗？推移有延续吗？(进入 Stage 3 承诺期)","原则：先让市场把流动性处理干净，再做方向表达！"],en:["Check 1: Is the setup too clean? Story too smooth? (Probably Stage 1 Setup)","Check 2: Are both sides getting swept? Breakouts instantly failing? (Definitely Stage 2 Wash-out)","Check 3: Is the macro pool purged? Does displacement have follow-through? (Entering Stage 3)","Rule: Let the market clean up liquidity FIRST, then express your direction!"]},script:{zh:"每次你想按鼠标之前，先对着这个清单拷问自己：大级别的池子扫了吗？现在是不是太顺了？如果是，立刻把手从鼠标上拿开！高手不是能抓住每一个机会，而是能避开所有的杀猪盘！",en:"Before you click the mouse, interrogate yourself with this list: Is the macro pool swept? Is it looking too easy right now? If yes, take your hands off the mouse immediately! Masters don't catch every move; they avoid every slaughterhouse!"}},{id:"m6-s15",title:{zh:"散户在归纳阶段的 5 种死法",en:"5 Ways Retail Dies in the Induction Phase"},diagram:"retail-deaths",bullets:{zh:["1. 在 Stage 1 看到 setup 就重仓预判进场","2. 在 Stage 2 第一次小信号出现时过早确认","3. 被 Stop Hunt 打掉后，情绪崩溃立刻反手追单","4. 把所有的流动性清算，都误解为大级别的趋势反转","5. 没耐心等到 Stage 3 的干净推移，就不停地在震荡里试错耗干本金"],en:["1. Going heavy on the very first Stage 1 setup.","2. Confirming too early on the first minor Stage 2 signal.","3. Emotionally reversing right after getting stop-hunted.","4. Misinterpreting every liquidity purge as a macro trend reversal.","5. Bleeding out capital by overtrading the chop, instead of waiting for Stage 3."]},script:{zh:"看看这5种死法，哪一种不是在报你的身份证号？被庄家扫损后气急败坏，立刻反手做空，结果正好碰上第三阶段的主升浪起爆，一波把你连根拔起！别再做这种蠢事了。",en:"Look at these 5 deaths, aren't they describing you perfectly? Getting stop-hunted by the MM, getting furious, emotionally reversing to short... just to meet the Stage 3 main expansion wave that wipes you completely out! Stop doing this stupid shit."}},{id:"m6-s16",title:{zh:"本章核心结论：不要抢跑！",en:"Core Conclusion: Do NOT Front-run!"},diagram:"core-conclusion-m6",bullets:{zh:["Setup 出现，绝对不代表市场准备好了！","第一个漂亮的信号，先默认它是诱导陷阱。","市场最像机会的时候，往往只是它最需要你当对手盘接盘的时候。","真正高级的交易，不是比谁进得更早，而是等市场从“诱导”完全过渡到“承诺”再拔刀！"],en:["A Setup appearing does NOT mean the market is ready!","Assume the first beautiful signal is an inducement trap.","When the market looks most like an opportunity, it usually just needs you as exit liquidity.","High-level trading isn't about entering earliest; it's waiting for Induction to fully transition into Commitment before drawing your sword!"]},script:{zh:"这一章结束！不要去抢跑！市场不会直接给你真正的单边，它通常会先给你一个“看起来像起飞”的毒苹果。洗仓没完成前，再美的形态都是绞肉机。管住手，等死尸遍地的时候，我们再进场！",en:`Module done! Do not front-run! The market won't hand you a true one-way trend directly; it usually hands you a poisoned apple that "looks like a moonshot". Before the wash-out is complete, every beautiful setup is a meat grinder. Hold your hands, wait until the corpses pile up, THEN we enter!`}}]},{id:"m7",title:{zh:'Module 7: The "Real" Wyckoff',en:'Module 7: The "Real" Wyckoff'},slides:[{id:"m7-s1",title:{zh:'Module 7 — The "Real" Wyckoff',en:'Module 7 — The "Real" Wyckoff'},diagram:"wyckoff-modern-overview",bullets:{zh:["Wyckoff 不是古典图谱背诵，而是现代流动性与控制权切换框架","从“认图”升级到读懂：吸收、诱导、测试与承诺","掌握 2024–2025 年最新复合型陷阱（变形 Spring/Upthrust）"],en:["Wyckoff is not a classic pattern to memorize, it's a modern framework for liquidity and control shifts.",'Upgrade from "pattern recognition" to reading: Absorption, Inducement, Test, and Commitment.',"Master the newest complex traps of 2024-2025 (Mutated Spring/Upthrust)."]},script:{zh:"大多数人不是没学过威科夫，而是把威科夫学成了迷信！看到弹簧效应就想做多，看到上冲回落就急着做空。你们在背图谱，而主力在看着你们背的图谱给你们下套！这一章，我要把你们从“图形背诵班”里拽出来，拉回血淋淋的实盘绞肉机里。真正的威科夫不是认图，而是读懂市场如何在区间内完成仓位转移！",en:`Most people haven't "not learned" Wyckoff, they learned it as a superstition! Seeing a Spring means instantly going long, seeing an Upthrust means rushing to short. You are memorizing patterns, while the market makers are setting traps based on the patterns you memorized! In this chapter, I'm dragging you out of the "pattern memorization class" and throwing you back into the bloody real-world meat grinder. The real Wyckoff is about reading how positions transfer inside a range!`}},{id:"m7-s2",title:{zh:"为什么大多数人学错了 Wyckoff",en:"Why Most People Learned Wyckoff Wrong"},diagram:"retail-deaths",bullets:{zh:["把 Wyckoff 当固定图谱，而不是动态过程","死记名词：SC、AR、ST、Spring，却不理解行为本质","忽略流动性、推移 (Displacement) 以及接受/拒绝","一看见边界被破就直接交易，成了最大的燃料","完全不知道现代市场到处都是“多段式、延迟确认型”陷阱"],en:["Treating Wyckoff as static patterns instead of a dynamic process.","Memorizing jargon (SC, AR, ST, Spring) without understanding the underlying behavior.","Ignoring liquidity, displacement, and acceptance/rejection.","Trading the exact moment a boundary breaks, instantly becoming fuel.","Unaware that modern markets are full of multi-stage, delayed-confirmation traps."]},script:{zh:"看看你们常犯的错：每天在图上标什么 SC、AR、ST，画得比清明上河图还漂亮，结果一做就亏！为什么？因为你把它当成了固定公式！你根本不看有没有空头被吸收，有没有真正的多头推移！在这个算法横行的年代，你只要敢在边界无脑挂单，主力有一百种复合陷阱让你死无全尸！记住：威科夫不是用来认图的，是用来读懂谁在被套的！",en:"Look at the mistakes you make: labeling SC, AR, ST on the chart every day, drawing it prettier than a masterpiece, and losing money every time! Why? Because you treat it as a fixed formula! You don't even check if shorts are absorbed or if there's true bullish displacement! In this era of algos, if you blindly place limit orders at boundaries, the market makers have a hundred complex traps to obliterate you!"}},{id:"m7-s3",title:{zh:"现代版 Wyckoff 的核心定义",en:"Core Definition of Modern Wyckoff"},diagram:"wyckoff-absorption",bullets:{zh:["市场进入一个平衡区 (Containment)","主导方开始在边界附近吸收对手盘 (Absorption)","通过扫损、假突破清理最后流动性 (Manipulation)","控制权切换后，进入不回头的单边推移 (Commitment)","抛弃低位必涨/高位必跌的错觉，只看谁的流动性被耗尽"],en:["The market enters a zone of balance (Containment).","The dominant side starts absorbing counter-parties near boundaries (Absorption).","Using stop runs and fakeouts to clear the final liquidity (Manipulation).","After control shifts, entering a one-way irreversible push (Commitment).",'Ditch the illusion of "low means buy/high means sell", only look at whose liquidity is exhausted.']},script:{zh:"让我给你们重新翻译一下威科夫：它其实就是在讲一个故事——市场先进入平衡，然后大资金开始在边界吸血，接着用假突破把你们最后一点止损全部吃干抹净，最后直接发动不回头的单边暴力推移！吸筹不是因为价格在低位所以涨，而是因为向下的卖盘全被吃光了，连砸盘的动能都枯竭了！这才是底层的供需密码！",en:`Let me translate Wyckoff for you again: it's telling a story. The market enters equilibrium, big money sucks blood at the edges, uses fakeouts to eat your final stops, and finally launches a violent one-way push! Accumulation doesn't go up because it's "low", it goes up because all downward selling pressure is eaten, and bearish momentum is completely drained! This is the true supply/demand code!`}},{id:"m7-s4",title:{zh:"现代版 Wyckoff 4 阶段总览",en:"Modern Wyckoff 4 Phases Overview"},diagram:"wyckoff-4-phases",bullets:{zh:["Phase 1 — 收容 (Containment)：建立平衡边界","Phase 2 — 吸收 (Absorption)：换手与压力测试","Phase 3 — 操控 (Manipulation)：致命诱导与清算","Phase 4 — 承诺 (Commitment)：单边突破与重定价"],en:["Phase 1 — Containment: Establishing balance boundaries.","Phase 2 — Absorption: Position transfer and pressure testing.","Phase 3 — Manipulation: Fatal inducement and liquidation.","Phase 4 — Commitment: One-way breakout and repricing."]},script:{zh:"忘掉那些古典教材里的 ABCDE 五个阶段，实盘中你只需要盯紧这四个动作：第一步，收容波动建立区间；第二步，在区间里疯狂吸收对手盘；第三步，刺破边界进行终极清算，制造假象；第四步，主力露出獠牙，打出承诺性的单边推移！真正能让你赚大钱的，绝对不是区间震荡，而是你能不能在第三步没死，并抓住了第四步的启动！",en:"Forget the classic A-B-C-D-E phases. In live trading, you just need to watch these 4 steps: 1. Containment builds the range. 2. Insane absorption inside the range. 3. Piercing boundaries for the ultimate purge. 4. Fangs out, commitment push! What makes you rich isn't trading the chop, it's surviving step 3 and catching the ignition of step 4!"}},{id:"m7-s5",title:{zh:"Phase 1: 收容 (Containment)",en:"Phase 1: Containment"},diagram:"structure-formula",bullets:{zh:["出现明显的停止行为 (Stopping Action)","价格不再顺畅单边推进，开始围绕中枢来回","初步形成可见的上边界与下边界","核心本质：这不是反转确认，而是市场在寻找新平衡","高级视角：单边推移后新低/新高的延续性断崖式下降"],en:["Obvious Stopping Action appears.","Price stops smooth one-way pushing, starting to oscillate around a median.","Initial upper and lower boundaries become visible.","Core essence: This is NOT a reversal confirmation, the market is just finding balance.","Advanced view: The follow-through of new highs/lows drops off a cliff."]},script:{zh:"第一阶段叫收容。一波暴跌之后，突然砸不动了，出现了暴力反弹，然后开始在上下边界里画门。听好，这不叫反转！这只是空头力竭，市场开始寻找新的对手盘了。如果你在收容阶段就急着去猜大底大顶，你就是在送死。这个阶段你要做的，就是画好边界，然后冷眼旁观！",en:"Phase 1 is Containment. After a massive dump, it suddenly can't drop further, bounces violently, and starts ping-ponging. Listen: this is NOT a reversal! It's just bears running out of gas and the market looking for new counter-parties. If you rush to guess the macro top/bottom here, you are asking for death. Just draw your boundaries and watch coldly."}},{id:"m7-s6",title:{zh:"Phase 2: 吸收 (Absorption)",en:"Phase 2: Absorption"},diagram:"wyckoff-absorption-detail",bullets:{zh:["价格反复测试区间边界，某一侧攻击越来越“费力”","累积型：下探频繁但新低质量极差，低位被快速收回","派发型：上冲频繁但新高质量极差，买盘一出就被砸","区间内部不断留下吸收对手盘的痕迹","边界外流动性被多次消耗，为最终突破掏空阻力"],en:['Price repeatedly tests boundaries, attacks on one side become "exhausting".',"Accumulation: Frequent dips but terrible new low quality, quickly reclaimed.","Distribution: Frequent spikes but terrible new high quality, immediately sold.","Footprints of absorbing counter-parties are left inside the range.","Liquidity outside boundaries gets consumed, hollowing out resistance."]},script:{zh:"第二阶段是吸收。在这个绞肉机里，你看的是震荡，我看的是谁的血槽空了！如果每次砸破前低，瞬间就被买盘抽回，阴线实体越来越小，这就是在吸筹！空头的子弹被接盘侠照单全收！记住，吸收的本质不是价格不跌，而是向下攻击越来越没有效率！",en:`Phase 2 is Absorption. In this meat grinder, you see chop, I see whose HP bar is emptying! If every dip below the low is instantly bought up, and bearish bodies get smaller, that's accumulation! Bear bullets are fully absorbed. Remember: the essence of absorption isn't "price not dropping", it's that downward attacks lose all efficiency!`}},{id:"m7-s7",title:{zh:"Phase 3: 操控 (Manipulation)",en:"Phase 3: Manipulation"},diagram:"wyckoff-complex-trap-logic",bullets:{zh:["市场突然以看似极强的动能突破区间边界","引爆止损、吸引突破追价、归纳预判者入场","核心任务：清理边界流动性、完成终极仓位转移","测试另一侧是否真正 ready","Phase 3 的意义在于：市场用什么方式拿到了最后一批燃料"],en:["Market suddenly breaks boundaries with seemingly extreme momentum.","Triggers stops, attracts breakout chasers, induces early predictors.","Core mission: Purge boundary liquidity, complete ultimate position transfer.","Tests if the other side is truly ready.","The meaning of Phase 3: How the market secured its final batch of fuel."]},script:{zh:"最血腥的第三阶段来了——操控！也就是你们常说的弹簧效应和上冲回落。主力突然一根大阴线砸破支撑，全世界都在喊破位做空！散户疯狂交出带血的筹码，主力张开血盆大口全盘吃下！这一步根本不是为了跌，而是为了把最后一批死多头扫地出门，同时把追空的白痴骗进来关门打狗！",en:"The bloodiest stage arrives: Manipulation! The famous Spring and Upthrust. Suddenly a massive red candle smashes support, the whole world screams breakdown! Retail hands over bloody chips, smart money eats it all. This move isn't meant to dump; it's meant to flush the last stubborn bulls and trap the idiot bears before locking the door!"}},{id:"m7-s8",title:{zh:"Phase 4: 承诺 (Commitment)",en:"Phase 4: Commitment"},diagram:"wyckoff-modern-overview",bullets:{zh:["操控结束后，出现极其干净的夺回 (Clean Reclaim)","极强的动能推移 (Displacement) 与延续性","原区间边界的角色瞬间发生反转 (Support <-> Resistance)","顺势的失衡缺口 (FVG) 和订单块 (OB) 效力暴增","真正的机会不在操控那一下，而在证明不回区间的时候"],en:["After manipulation, an extremely clean reclaim occurs.","Extreme displacement and follow-through.","The old boundary's role instantly flips (Support <-> Resistance).","Pro-trend FVGs and OBs become extremely effective.","The true opportunity isn't the manipulation spike itself, but when it proves it won't return to the range."]},script:{zh:"这就是终局：承诺性推动！当主力吃饱喝足，一根擎天柱阳线直接贯穿整个区间，根本不给空头任何喘息的机会！回踩？最多只给你一个浅到令人发指的回踩！所有的缺口全部得到捍卫，价格一骑绝尘。顶尖的交易员，永远是在确认主力给出这种绝不回头 的承诺后，重仓出击！",en:'This is the endgame: Commitment Move! When big money is full, a god-candle pierces the entire range, giving bears zero chance to breathe! Pullback? It only gives you an disgustingly shallow pullback! All gaps are defended, price takes off. Top traders always strike heavy AFTER confirming this "no-turning-back" commitment!'}},{id:"m7-s9",title:{zh:"经典实战：Accumulation -> Spring -> Markup",en:"Classic Case: Accumulation -> Spring -> Markup"},chartData:k6,annotations:j6,bullets:{zh:[],en:[]},script:{zh:"睁大眼睛看看这张实盘图！这就是最经典的底部弹簧。价格在低位烂缠了那么久，突然向下刺穿支撑，底部的止损单像烟花一样连环爆炸！散户绝望割肉，但你看看下一根 K 线！直接暴力收回中枢，这就是最强的多头夺回（Reclaim）！随后中轴被彻底碾碎，单边狂飙开始。记住：不是跌破本身值钱，而是跌破后被暴力收回的动作最值钱！",en:"Open your eyes to this live chart! The most classic bottom Spring. Chopping for ages, then suddenly piercing support. Stops explode like fireworks! Retail cuts losses in despair, but look at the very next candle! Violently reclaims the range. That is the ultimate Reclaim! The midline gets crushed, one-way rally begins. Remember: the breakdown isn't valuable, the violent reclaim AFTER the breakdown is where the money is!"}},{id:"m7-s10",title:{zh:"Spring / Upthrust 的真伪鉴定",en:"Validating Spring / Upthrust"},diagram:"wyckoff-validation",bullets:{zh:["高质量 Spring：下破扫损 -> 明显拒绝/收回 -> 控制权上移","无效 Spring：下破后无法收回中枢，或收回后立刻再次失守","高质量 Upthrust：上破前高 -> 迅速失去接受 -> 卖压极强延续","无效 Upthrust：上破后在高位高位盘整并被接受 (假突破变真突破)"],en:["High-quality Spring: Sweep low -> clear rejection/reclaim -> upward control shift.","Invalid Spring: Fails to reclaim the range, or immediately loses it again.","High-quality Upthrust: Sweep high -> rapid loss of acceptance -> heavy sell continuation.","Invalid Upthrust: Consolidates high and is accepted (fakeout becomes real breakout)."]},script:{zh:"别一看到破位又弹了一点点就喊弹簧！一个真正极品弹簧，不仅要破位杀人，还得在杀完人之后迅速夺回阵地！如果破位后像死狗一样趴在下面起不来，那就是真暴跌！同样，如果你看到价格上破前高，虽然回落了一点，但随后死死咬住高位不放，这时候你敢去摸顶，绝对被大阳线一波带走！看接受度，别死记形态！",en:"Stop calling every tiny bounce after a breakdown a Spring! A god-tier Spring must kill, and then instantly reclaim the territory! If it breaks down and lies there like a dead dog, that's a real crash! Likewise, if you see an Upthrust that hovers high and refuses to drop... if you try to short the top there, you'll get wiped by a massive green candle! Read acceptance, don't memorize shapes!"}},{id:"m7-s11",title:{zh:"2024-2025：复合陷阱的崛起",en:"2024-2025: The Rise of Complex Traps"},diagram:"wyckoff-complex-trap-logic",bullets:{zh:["散户越来越熟悉经典 Wyckoff，主力必须升级玩法","算法流动性机制让边界处理更加碎片化","机构不再满足于单次清算，多阶段清算收割效率更高","现在更常见：下破 -> 收回 -> 再下破 -> 深度绝望 -> 最终启动"],en:["Retail is familiar with classic Wyckoff; institutions MUST upgrade.","Algo liquidity mechanisms fragment boundary handling.","Institutions are no longer satisfied with single purges; multi-stage is more efficient.","Now standard: Breakdown -> Reclaim -> Deeper breakdown -> Absolute Despair -> Real Launch."]},script:{zh:"时代变了！现在是 2025 年！如果你还在等那种一次性刺破然后立刻起飞的完美形态，你不是踏空就是被洗死！现在的量化算法极度下流，它们知道你们把止损放在哪，它们会刺破一次给你希望，再刺破第二次让你绝望！不把你榨干，车绝对不开！复合陷阱，才是当前市场的底色！",en:"Times have changed! It's 2025! If you're still waiting for a perfect one-time sweep before a moonshot, you'll either miss out or get chopped to pieces! Modern algos are filthy. They know your stops. They pierce once to give hope, pierce twice to give despair! Until you are drained, the train won't leave! Complex traps are the new baseline!"}},{id:"m7-s12",title:{zh:"实战变形 1：Double Spring (双重弹簧)",en:"Variant 1: Double Spring"},chartData:A6,annotations:O6,bullets:{zh:[],en:[]},script:{zh:"看看这张极其恶心的双重弹簧图！第一次下破，收回，散户欢呼雀跃冲进去做多。结果呢？根本没有单边推移！行情像软脚虾一样横盘，接着突然再给你一记重锤！比第一次砸得更深！那些提早抄底的聪明人全被这第二刀送上了西天。只有在这第二次深度清扫、并且彻底夺回控制权之后，真正的狂暴拉升才正式开始！",en:"Look at this disgusting double spring chart! First breakdown, reclaimed. Retail cheers and goes long. Result? No displacement at all! It chops like wet noodles, then suddenly drops the hammer AGAIN! Deeper than the first! All the smart early-buyers get sent to hell. Only after this SECOND deep sweep and complete reclaim does the actual parabolic rally begin!"}},{id:"m7-s13",title:{zh:"实战变形 2：Upthrust 附带高位假接受",en:"Variant 2: Upthrust with Fake Acceptance"},chartData:z6,annotations:T6,bullets:{zh:[],en:[]},script:{zh:"这招简直阴毒到了极点！价格突破区间上沿，按理说是上冲回落对吧？不，主力偏偏在高位给你收了几根十字星，营造出一种“突破有效，正在高位站稳”的假象！突破流交易者一看，哇，高位接受了，满仓干多！结果下一秒，一根天量大阴线直接砸回区间内部！所有在高位追多的人瞬间变成被关门打狗的燃料，随后行情直接瀑布！",en:'This is pure evil! Price breaks the range high. It should just reject, right? No, big money prints dojis at the highs, creating the illusion of "successful breakout, holding support"! Breakout traders scream "Acceptance!" and go full margin long. Next second, an apocalyptic red candle smashes back into the range. All high-buyers become trapped fuel, and the waterfall dump begins!'}},{id:"m7-s14",title:{zh:"实战变形 3：Spring + FVG 诱导猎杀",en:"Variant 3: Spring + FVG Failure"},chartData:E6,annotations:M6,bullets:{zh:[],en:[]},script:{zh:"这是把威科夫和缺口理论结合的终极绞肉机！跌破低点形成弹簧，反弹的时候故意给你留下一个极其漂亮的看涨 FVG！你以为这是上车机会？大错特错！当价格回踩缺口，吸引你们这批理智多头进场后，主力反手再砸一根大阴线，直接贯穿缺口，把你们全杀光！洗干净之后，再原地上天！",en:`This is the ultimate meat grinder combining Wyckoff and FVG theory! Sweeps the low for a spring, bounces, and intentionally leaves a beautiful bullish FVG! You think it's a safe entry? Dead wrong! When price retraces to fill the FVG, luring the "smart" longs, smart money drops a massive red candle right through it, killing everyone! Once washed clean, it rockets to the moon!`}},{id:"m7-s15",title:{zh:"Spring / Upthrust 的 3 种执行模型",en:"3 Execution Models for Spring / Upthrust"},diagram:"wyckoff-decision-tree",bullets:{zh:["1. 激进型：在边界扫损瞬间直接左侧接飞刀 (盈亏比极高，极易被二次清算)","2. 标准型：等价格明确回到区间内部 (Reclaim) 后右侧入场","3. 保守型：只做 Phase 4 的回踩，等彻底脱离区间再做","机构原则：不要交易边界被碰到，要交易边界被利用后控制权的切换"],en:["1. Aggressive: Catching the knife at the exact boundary sweep (High RR, high risk of double-sweep).","2. Standard: Entering right-side ONLY after price explicitly reclaims the range.","3. Conservative: Trading Phase 4 pullbacks, waiting for full range departure.","Rule: Do not trade boundaries being touched; trade the control shift AFTER boundaries are exploited."]},script:{zh:"别再瞎做了，这里给你三把刀！想赌命的激进派，直接在边界刺穿的瞬间接飞刀，盈亏比爆表，但极容易被双重陷阱砍死。标准做法是：必须等这根 K 线实打实地收回区间内部，确认洗盘结束再进！而真正稳健的老手，根本不在乎底部那点利润，他们只等第四阶段确认爆发，吃最肥最安全的中段！",en:"Stop guessing! Here are 3 weapons: Aggressive gamblers catch the knife at the exact sweep—godly RR, but easily chopped by double traps. Standard is waiting for a confirmed reclaim inside the range. But true veterans don't care about the exact bottom; they wait for Phase 4 explosion and eat the safest, fattest meat in the middle!"}},{id:"m7-s16",title:{zh:"现代 Wyckoff 终极决策树",en:"Modern Wyckoff Decision Tree"},diagram:"wyckoff-decision-tree",bullets:{zh:["1. 是否存在明确的平衡收容区？","2. 边界突破是否清理了显性流动性？","3. 是否快速回到区间内部并发生接受度切换？","4. 是否出现动能推移 (Displacement) 与延续？","最终拷问：这是 Phase 3 的诱导，还是已进入 Phase 4 的承诺？"],en:["1. Is there a clear balance containment zone?","2. Did the breakout clear obvious liquidity?","3. Did it quickly return to the range and shift acceptance?","4. Is there actual displacement and follow-through?","Final question: Is this Phase 3 Inducement, or Phase 4 Commitment?"]},script:{zh:"做单之前，把这张决策树给我刻在脑子里！先问自己，这里有明显的平衡区吗？刚刚的破位把谁给埋了？破位之后是像钉子一样钉在外面，还是像触电一样缩了回来？如果没有推移，如果没有破坏结构，一切都是耍流氓！不满足这几个条件，管它长得多像教材，全部当成陷阱处理！",en:"Engrave this decision tree in your brain! Ask yourself: Is there a balance zone? Who just got buried by the breakout? Did it stick outside like a nail, or recoil like touching fire? If there is no displacement, no structure shift, it's all bullshit! If these aren't met, I don't care if it looks like a textbook, treat it as a trap!"}},{id:"m7-s17",title:{zh:"Module 7 核心结论",en:"Module 7 Core Conclusion"},diagram:"wyckoff-modern-overview",bullets:{zh:["现代 Wyckoff 本质：平衡 -> 吸收 -> 操控 -> 承诺","Spring / Upthrust 不是图形，而是流动性清理与控制权转移","2024-2025 实盘常态：复合型、多段式陷阱","最高级的交易方式不是押注极值，而是等待承诺性推动","Wyckoff 的真正价值：帮你看懂市场何时结束操控，开始承诺"],en:["Modern Wyckoff: Balance -> Absorption -> Manipulation -> Commitment.","Spring/Upthrust are not shapes, they are liquidity purges and control transfers.","2024-2025 reality: Complex, multi-stage traps.","High-level trading isn't betting on extremes; it's waiting for commitment.","Wyckoff's true value: Seeing exactly when manipulation ends and commitment begins."]},script:{zh:"总结一下！真正的威科夫，绝不是教你画图认形态的破烂教科书，它是一套极度严密的资金行为心理学！从平衡到吸收，从操控屠杀到最终承诺，一步都不能少！在这个变态的现代市场里，别去迷信那个最低点，真正能让你活下来并暴富的，是学会看懂主力何时杀完了人，何时开始兑现承诺！",en:"To summarize! Real Wyckoff isn't a garbage textbook for drawing shapes; it's a rigorous psychology of capital behavior! From balance to absorption, slaughter to commitment, no step is skipped! In this twisted modern market, stop worshipping the exact bottom. What keeps you alive and makes you rich is seeing exactly when smart money finishes killing, and starts delivering the promise!"}}]},{id:"m8",title:{zh:"Module 8: Confluence of Evidence",en:"Module 8: Confluence of Evidence"},slides:[{id:"m8-s1",title:{zh:"Module 8 — Confluence of Evidence",en:"Module 8 — Confluence of Evidence"},diagram:"m8-confluence-layers",bullets:{zh:["单根 K 线骗线级别的多维度确认法","不要再因为一根 Pin bar、一块 FVG 就下注","真正的专业交易靠证据堆叠，不靠图形冲动","最低 5 重证据叠加才动手 (5/8 规则)"],en:["Multi-dimensional confirmation to defeat single-candle traps.","Stop betting your account on a single Pin Bar or FVG.","True professional trading relies on evidence stacking, not impulse.","Minimum 5 layers of evidence before execution (5/8 Rule)."]},script:{zh:`市场上最便宜的东西，就是一根看起来很漂亮的 K 线。市场上最贵的错误，就是你只因为它漂亮就下了满仓！

大多数散户永远在追求所谓的高胜率“神仙形态”，但真正的顶尖操盘手根本不在乎形态。我们只在乎：在这个时间、这个结构、这个流动性背景下，所有的证据是不是都指向同一个方向？如果不能形成多维度的共振 (Confluence)，就算图表上画出一朵花，老子也绝对不开一枪！`,en:`The cheapest thing in the market is a beautiful looking candlestick. The most expensive mistake is going full margin just because it looked pretty!

Most retail traders chase "holy grail" patterns. Top institutional traders couldn't care less about patterns. We only care: At this time, in this structure, with this liquidity context, does all the evidence point in the exact same direction? Without multi-dimensional confluence, I wouldn't fire a single bullet even if the chart drew a masterpiece!`}},{id:"m8-s2",title:{zh:"为什么单根 K 线最容易骗线？",en:"Why Single Candles Trap Retail"},diagram:"m8-single-candle-trap",bullets:{zh:["单根 K 线信息量极低，无法独立说明语境","它无法告诉你：控制权是否切换？流动性是否已经拿到？","同样一根看涨吞没/锤子线，在不同位置意义完全相反","结论：单根 K 线不是交易理由，它只是提醒你“该找证据了”"],en:["A single candle holds near-zero information; it provides no context.","It cannot tell you: Has control shifted? Was liquidity taken?","The exact same Bullish Engulfing or Pin Bar means completely opposite things at different locations.",'Conclusion: A candle is NOT a reason to trade; it is merely an alert to "start gathering evidence".']},script:{zh:`这就是为什么你们学了那么多K线战法，最后还是亏成了狗！

你看到一根带有长长下影线的完美 Pin Bar，你觉得主力在护盘，直接做多。结果下一秒大阴线直接把你活埋！为什么？因为你这根完美的 K 线出现在震荡区间的正中央！它既没有清扫之前的止损池，也没有高周期的叙事支撑。单根 K 线就像犯罪现场的一个脚印，它只是提示你这里有情况，它绝对不是定罪的证据！`,en:`This is why you studied candlestick bibles and still bleed money like a stuck pig!

You see a perfect Pin Bar with a massive lower wick, you think smart money is defending, so you long. Next second, a giant red candle buries you alive! Why? Because your "perfect" candle appeared dead in the middle of a chop zone! It didn't sweep any prior stops, nor did it have higher timeframe backing. A single candle is like a footprint at a crime scene—it alerts you, but it is NEVER enough evidence to convict!`}},{id:"m8-s3",title:{zh:"什么叫真正的 Confluence (共振)？",en:"What is True Confluence?"},diagram:"m8-confluence-layers",bullets:{zh:["伪共振：同一区域画了趋势线、黄金分割、OB 和 FVG (只是位置重叠)","真共振：多个“互相独立”的维度说的是同一个故事","维度包括：结构、流动性、阶段、位移质量、接受/拒绝、执行区、时间","真正的共振，是“行为逻辑”的叠加，而不是画线工具的叠加"],en:["Fake Confluence: Drawing a trendline, fib, OB, and FVG at the same spot (just spatial overlap).",'True Confluence: Multiple "mutually independent" dimensions telling the EXACT same story.',"Dimensions: Structure, Liquidity, Phase, Displacement, Acceptance, Execution, Timing.",'True confluence is stacking "behavioral logic", not stacking drawing tools.']},script:{zh:`不要把你们图上画得乱七八糟的指标叫作共振！你在同一个位置画了黄金分割 0.618，画了一根趋势线，又画了一个矩形，这不叫证据叠加！这叫同一类证据的重复画图！

真正的共振是什么？是日线级别的流动性刚刚被清扫完毕 (环境)，15分钟图上出现暴力推移 (动能)，回踩时精准在伦敦盘开盘时段 (时间)，并且市场死死守住了新价格区 (接受)！这才是互相独立的逻辑闭环！`,en:`Stop calling your chart cluttered with 15 indicators "confluence"! You drew a 0.618 fib, a trendline, and a box at the exact same price level. That isn't evidence stacking! That's just drawing the same spatial evidence three times!

What is true confluence? It's when Daily liquidity was just swept (Environment), the 15-minute chart shows violent displacement (Momentum), the pullback aligns perfectly with the London open (Timing), and the market fiercely defends the new price zone (Acceptance)! That is a mutually independent, bulletproof logical loop!`}},{id:"m8-s4",title:{zh:"专业交易者的 8 维证据体系",en:"The 8-Dimension Evidence System"},diagram:"m8-checklist",bullets:{zh:["1. 高级别叙事 (HTF Narrative)","2. 结构位置 (Market Structure)","3. 流动性背景 (Liquidity Context)","4. 当前阶段 (Phase/State)","5. 位移质量 (Displacement vs Exhaustion)","6. 接受/拒绝行为 (Acceptance/Rejection)","7. 执行区 (Execution Zone - OB/FVG)","8. 时间/时段优势 (Timing/Session)"],en:["1. HTF Narrative","2. Market Structure Location","3. Liquidity Context","4. Phase / Market State","5. Displacement vs Exhaustion","6. Acceptance / Rejection","7. Execution Zone (OB/FVG)","8. Timing / Session Edge"]},script:{zh:`这是你从今天起必须刻在骨子里的 8 维打分系统！

不要在看到某个订单块的时候脑子一热就冲进去。立刻强迫自己对着这 8 个维度挨个拷问：高级别在干什么？流动性清干净了吗？推移是真的吗？时间对吗？只有当你像一个冷血的法官一样，审问完所有这 8 个细节，你才有资格谈论入场！`,en:`This is the 8-dimension scoring system you must engrave into your bones from today onward!

Do not just rush in hot-headed because you saw an Order Block. Force yourself to instantly interrogate these 8 dimensions: What is the HTF doing? Is liquidity purged? Is the displacement real? Is the timing right? Only when you interrogate these details like a cold-blooded judge do you earn the right to execute a trade!`}},{id:"m8-s5",title:{zh:"实盘图解：极品 6/8 多头共振",en:"Chart: Flawless 6/8 Bullish Confluence"},chartData:i6,annotations:r6,bullets:{zh:[],en:[]},script:{zh:`看这张图！为什么敢在这里重仓按下去？因为这不是瞎猜底！

1. 大级别旧低止损池被清扫 (流动性)。2. 随后强势夺回局部结构 (结构)。3. 一根巨大阳线留下缺口 (位移)。4. 回踩 FVG 没跌破 (执行区与接受)。5. 纽约盘开盘发力 (时间)。这根小小的阳线起爆点，背后站着至少 6 重铁一般的证据支撑！这就是机构眼里的必杀局！`,en:`Look at this chart! Why do we dare load the boat here? Because this isn't guessing a bottom!

1. HTF old low stop pool is swept (Liquidity). 2. Aggressive reclaim of local structure (Structure). 3. Massive green candle leaves a gap (Displacement). 4. FVG retest holds firm (Execution & Acceptance). 5. NY session opens and fires (Timing). That tiny bullish trigger candle is backed by at least 6 layers of ironclad evidence! This is an institutional kill-shot!`}},{id:"m8-s6",title:{zh:"实盘图解：垃圾 2/8 陷阱 (致命单 K 线)",en:"Chart: Garbage 2/8 Trap (Lethal 1-Candle)"},chartData:a6,annotations:l6,bullets:{zh:[],en:[]},script:{zh:`再看看这张墓地一样的图！图中间出现了一根非常“标准”的长下影线看涨 Pin Bar。多少散户看到这个瞬间就兴奋了？

但你拿证据系统一扫：它不在关键结构上；前面没有任何流动性清扫；没有任何前期推移留下的缺口保护；更不在有效交易时段！得分：2/8。这种只有图形没有任何逻辑背景的 K 线，纯粹是主力挂在悬崖边上的鱼饵，下一秒大阴线直接把你们的账户干爆！`,en:`Now look at this graveyard! Dead in the middle of nowhere appears a very "standard" bullish Pin Bar with a long lower wick. How many retail traders get instantly aroused by this?

But scan it with the evidence system: It's not on key structure. No prior liquidity sweep. No prior displacement gap protecting it. Not even in an active session! Score: 2/8. A candle with a shape but zero logical context is just bait hung over a cliff by smart money. Next second, a giant red candle vaporizes your account!`}},{id:"m8-s7",title:{zh:"实盘图解：极品 7/8 空头共振",en:"Chart: Flawless 7/8 Bearish Confluence"},chartData:o6,annotations:s6,bullets:{zh:[],en:[]},script:{zh:"这是终极空头杀阵！价格上破旧高，把追高盘全部骗进来后 (流动性)。高位立刻失去接受，一根大阴线像断头台一样砸下 (位移与拒绝)。顺带留下了致命的 FVG Inversion 阻力区 (执行区)。所有看多的人在这一刻全部被套牢！当价格回测这个区域时，配合伦敦/纽约时段的交接点 (时间)。7 重证据共振，你要做的就是闭着眼睛扣动扳机，享受瀑布！",en:"This is the ultimate bearish kill array! Price sweeps the old high, sucking in all breakout chasers (Liquidity). It instantly loses acceptance at the high, dropping a red guillotine candle (Displacement & Rejection). It leaves behind a lethal FVG Inversion resistance (Execution Zone). All longs are trapped! When price retests this zone, perfectly aligning with the London/NY handoff (Timing). 7 layers of confluence. All you do is close your eyes, pull the trigger, and enjoy the waterfall!"}},{id:"m8-s8",title:{zh:"执行底线：5/8 规则 (The 5/8 Rule)",en:"The Execution Baseline: 5/8 Rule"},diagram:"m8-checklist",bullets:{zh:["这是专业交易员的铁律：没有 5 个以上的证据独立支持，绝不开枪","0-4 项证据：垃圾局，看戏 (不准做)","5 项证据：勉强及格，轻仓试探 (B 级 Setup)","6 项证据：胜率极大，标准仓位 (A- 级 Setup)","7-8 项证据：重仓猎杀局 (A+ 级 Setup)"],en:["The iron law of professionals: Without 5+ independent evidence layers, NEVER fire.","0-4 layers: Garbage setup. Grab popcorn (NO TRADE).","5 layers: Barely passes. Light size (B-Tier Setup).","6 layers: High win rate. Standard size (A- Tier Setup).","7-8 layers: Heavy kill-shot (A+ Tier Setup)."]},script:{zh:`这就是把主观交易变成机器般冷血执行的核心秘密！

从今天起，别凭感觉做单！对着打分卡一项一项勾选。不到 5 分，哪怕图表看起来再性感，你也必须把手绑在椅子上！如果能达到 6 分以上，那就不要有任何犹豫，严格按风控按下核按钮！用铁一样的纪律，把你的账户从随机赌博的赌场里拉出来！`,en:`This is the core secret to turning discretionary trading into machine-like, cold-blooded execution!

From today on, no more trading on "feel"! Check the scorecard box by box. If it doesn't hit 5 points, I don't care how sexy the chart looks, tie your hands to the chair! If it hits 6 or above, hesitate for exactly zero seconds, follow your risk management, and press the nuclear button! Use iron discipline to drag your account out of the random gambling casino!`}},{id:"m8-s9",title:{zh:"实盘操作流程：先打分，再找扳机",en:"Execution Flow: Grade First, Trigger Last"},diagram:"m8-decision-flow",bullets:{zh:["大部分烂交易死在第一步，大部分好交易赢在最后一步等待","顺序：先看大级别叙事和流动性目标","再等控制权切换 (Displacement / Acceptance)","在执行区 (FVG/OB) 用时间轴核对打分","原则：先有交易理由，再有入场扳机；绝不能反过来！"],en:["Most trash trades die on step 1, most great trades win on the final wait.","Order: First map HTF narrative and liquidity targets.","Wait for control shift (Displacement / Acceptance).","Grade in the execution zone (FVG/OB) against the session time.","Rule: The trade reason comes FIRST, the trigger candle comes LAST. Never reverse this!"]},script:{zh:`最后总结你们散户最愚蠢的习惯：你们总是先看到一根 K 线（扳机），然后疯狂给自己找理由，画各种线来证明自己可以做多。这是本末倒置！

专业杀手永远是先用 8 维证据系统锁定了一块即将发生屠杀的死亡地带，静静地趴在那里，最后那一根 K 线，只是猎物踩上地雷时听到的一声脆响！把思维反过来，你就是收割者！`,en:`Let me summarize your dumbest retail habit: You always see a candle FIRST (the trigger), and then frantically look for reasons, drawing random lines to justify going long. That is entirely backwards!

A professional assassin uses the 8-dimension system to lock onto a kill zone well in advance. They lie there silently. That final candlestick is just the crisp click of the prey stepping on the landmine! Reverse your thinking, and you become the reaper!`}}]},{id:"m9",title:{zh:"Module 9: Execution Framework",en:"Module 9: Execution Framework"},slides:[{id:"m9-s1",title:{zh:"Module 9 — 机构 3 种最狠的入场模型",en:"Module 9 — 3 Most Lethal Institutional Entry Models"},diagram:"m9-overview",bullets:{zh:["不是“哪里看起来能做”，而是“在哪种状态下，哪种模型拥有最优非对称性”","Model 1: Manipulation Entry (假突破入场)","Model 2: Confirmation Entry (OB + FVG + Displacement 组合)","Model 3: Turtle Soup +2 (2025 年改良版)","把前面 1-8 模块全部落到真正执行层"],en:['Not "where it looks tradable", but "which state gives which model the best asymmetry"',"Model 1: Manipulation Entry (Fake Breakout)","Model 2: Confirmation Entry (OB + FVG + Displacement)","Model 3: Turtle Soup +2 (2025 Improved Version)","Translating Modules 1-8 into true execution"]},script:{zh:"这一章解决的是大多数交易者最痛的一个问题：你可能已经会看结构、会看流动性、会看 FVG，但真正到要点“买入 / 卖出”的那一刻，还是容易乱。这一章我们不讲虚的，只讲执行！",en:`This chapter solves the biggest pain point for most traders: You might know structure, liquidity, and FVGs, but when it's time to actually click "buy/sell", you still freeze or mess up. We are dropping the theory and focusing purely on execution!`}},{id:"m9-s2",title:{zh:"散户执行阶段的 4 大致命死法",en:"4 Lethal Execution Mistakes of Retail Traders"},diagram:"m9-mistakes",bullets:{zh:["1. 抢跑 (FOMO)：没等控制权转移就提前挂单","2. 追尾 (Chasing)：在位移耗尽 (Exhaustion) 时追涨杀跌","3. 迷信图形：在错误的流动性环境里做“标准形态”","4. 止损乱放：按固定点数止损，而不是按逻辑失效点止损"],en:["1. Front-running (FOMO): Entering before control shifts.","2. Chasing: Buying/selling into exhaustion after the move.",'3. Pattern Worship: Trading "textbook patterns" in the wrong liquidity context.',"4. Arbitrary Stops: Using fixed pip stops instead of logical invalidation points."]},script:{zh:"在讲模型之前，先看看你们是怎么死的！第一种，看到价格靠近支撑就提前挂单，结果被一波带走。第二种，看到大阳线怕错过，直接追在天花板。第三种，在震荡区中间做完美的 Pin Bar。第四种，止损永远设 20 个点，刚好被扫掉然后看着行情起飞。戒掉这四个毛病，你才能活下来！",en:"Before we discuss models, let's see how you die! First, front-running support and getting swept. Second, chasing giant green candles right into the ceiling. Third, trading a perfect Pin Bar in the middle of chop. Fourth, using a fixed 20-pip stop that gets hunted right before the real move. Cure these four diseases to survive!"}},{id:"m9-s3",title:{zh:"三大入场模型全景图",en:"The 3 Entry Models Overview"},diagram:"m9-overview",bullets:{zh:["Model 1: Manipulation Entry (假突破) - 极速反转，V型收回","Model 2: Confirmation Entry (确认) - 扫荡 -> 破坏 -> 缺口 -> 回踩","Model 3: Turtle Soup +2 (改良海龟汤) - 扫荡 -> 双重拒绝","所有模型的核心：必须先有流动性清扫 (Liquidity Sweep)！"],en:["Model 1: Manipulation Entry (Fakeout) - Extreme reversal, V-shape reclaim.","Model 2: Confirmation Entry - Sweep -> CHOCH -> FVG -> Retest.","Model 3: Turtle Soup +2 - Sweep -> Double Rejection.","Core to ALL models: A Liquidity Sweep MUST happen first!"]},script:{zh:"这是我们今天要讲的三大杀器！记住一个铁律：没有任何一个模型是在没有清扫流动性的情况下触发的！不扫止损，绝不入场！",en:"These are the three lethal weapons we will cover today! Remember one iron rule: NONE of these models trigger without a prior liquidity sweep! No stop hunt, no entry!"}},{id:"m9-s4",title:{zh:"Model 1: Manipulation Entry (本质)",en:"Model 1: Manipulation Entry (Essence)"},diagram:"m9-manipulation-entry",bullets:{zh:["本质：利用散户的突破跟随盘和止损盘，建立反向头寸","视觉特征：一根长长的针尖 (Wick) 刺穿关键位，随后立刻反向吞没","心理学：让追突破的人瞬间绝望，让设止损的人瞬间拍大腿"],en:["Essence: Using retail breakout chasers and stop-losses to build counter-positions.","Visual: A long wick piercing a key level, followed instantly by a reverse engulfing.","Psychology: Making breakout traders instantly despair, and stop-loss traders instantly regret."]},script:{zh:"假突破入场的本质是什么？就是吃人！主力故意把价格推破关键阻力，让散户以为要起飞了，疯狂追多。等散户的买单全部成交，主力立刻反手砸盘，形成一根长长的上影线。这就是最血腥的财富转移！",en:"What is the essence of Manipulation Entry? It's cannibalism! Smart money deliberately pushes price past key resistance, making retail think it's mooning. Once retail buy orders are filled, smart money instantly dumps, leaving a massive upper wick. This is the bloodiest wealth transfer!"}},{id:"m9-s5",title:{zh:"Model 1: 什么时候能做？(前提条件)",en:"Model 1: Prerequisites"},diagram:"m9-manipulation-entry",bullets:{zh:["1. 必须有极其明显的流动性池 (如：平齐高低点 EQH/EQL)","2. 必须在关键时间节点 (如：伦敦开盘、纽约开盘、新闻发布)","3. 价格必须处于震荡区间边缘，或逆着大级别趋势的局部高低点"],en:["1. Must have an extremely obvious liquidity pool (e.g., EQH/EQL).","2. Must be at a key time window (London Open, NY Open, News).","3. Price must be at range edges, or counter-trend local extremes."]},script:{zh:"不是随便一个假突破都能做！前提条件极其苛刻：第一，必须有明显的止损池，没有诱饵主力不会动手。第二，必须在活跃时段，亚洲盘半夜的假突破往往是真没动能。第三，最好在震荡区间的边缘！",en:"You can't trade just any fakeout! The prerequisites are strict: First, an obvious stop pool must exist; without bait, smart money won't act. Second, it must be during active sessions; midnight Asian fakeouts are often just dead momentum. Third, ideally at the edges of a ranging market!"}},{id:"m9-s6",title:{zh:"Model 1: 触发逻辑 (Trigger)",en:"Model 1: Trigger Logic"},diagram:"m9-manipulation-entry",bullets:{zh:["第一步：价格刺穿关键位 (Sweep)","第二步：立刻以大实体 K 线反向收回关键位之内 (Reclaim)","扳机：收回关键位的那根 K 线闭合的瞬间，直接市价入场 (Market Execution)"],en:["Step 1: Price pierces the key level (Sweep).","Step 2: Instantly reclaims inside the key level with a full-bodied candle (Reclaim).","Trigger: The exact moment the reclaiming candle closes, enter at market (Market Execution)."]},script:{zh:"触发逻辑非常暴力：扫荡，然后立刻收回！记住，收回的这根 K 线必须是坚决的、大实体的。当这根 K 线在关键位内部闭合的一瞬间，不要犹豫，直接市价敲进去！",en:"The trigger logic is violent: Sweep, then instantly reclaim! Remember, the reclaiming candle must be decisive and full-bodied. The exact second this candle closes back inside the key level, do not hesitate—hit the market order!"}},{id:"m9-s7",title:{zh:"Model 1: 止损与失效逻辑",en:"Model 1: Stop Loss & Invalidation"},diagram:"m9-manipulation-entry",bullets:{zh:["止损位：放在扫荡针尖的极值点外 + 1-2 Ticks (极窄止损)","失效逻辑 (Invalidation)：如果扫荡后，价格在关键位外部停留超过 3-4 根 K 线，或者出现连续的同向 FVG，说明这不是假突破，而是“接受 (Acceptance)”！"],en:["Stop Loss: Just outside the extreme wick of the sweep + 1-2 Ticks (Ultra-tight stop).",`Invalidation: If price stays outside the key level for > 3-4 candles, or prints consecutive same-direction FVGs, it's NOT a fakeout. It's "Acceptance"!`]},script:{zh:"这个模型的魅力在于极高的盈亏比！止损就放在针尖外面一点点。如果价格再次打掉针尖，说明我们的判断全错，认赔出局。最关键的失效逻辑：如果扫出去之后，价格在外面磨磨唧唧不回来，甚至开始搭平台，立刻撤销所有反向计划，这是真突破！",en:"The beauty of this model is the insane Risk/Reward! Place the stop just outside the wick. If price takes out the wick again, our entire premise is wrong—take the small loss. The critical invalidation: If price sweeps and then lingers outside, building a base, cancel all reversal plans immediately. That is a real breakout!"}},{id:"m9-s8",title:{zh:"Model 1: 最佳适用场景",en:"Model 1: Best Scenarios"},diagram:"m9-model-selection",bullets:{zh:["最强场景：亚洲盘形成明显区间，伦敦盘开盘向下假突破扫掉亚盘低点，随后 V 型反转向上。","优势：盈亏比极高 (经常能抓到日内绝对高低点)","劣势：需要极强的盘感和果断的执行力，容易被连续扫荡"],en:["Best Scenario: Asian session forms a range, London Open fakes down to sweep Asian Lows, then V-shape reverses up.","Pros: Extreme R:R (often catches the absolute daily High/Low).","Cons: Requires sharp screen-time and decisive execution; prone to consecutive sweeps."]},script:{zh:"最经典的剧本就是“亚洲盘震荡，伦敦盘扫荡，纽约盘延续”。伦敦开盘那一瞬间的向下插针，就是你用 Model 1 扣动扳机的最佳时刻！",en:'The most classic script is "Asian Consolidation, London Manipulation, NY Continuation." That downward wick the exact moment London opens is your perfect moment to pull the trigger with Model 1!'}},{id:"m9-s9",title:{zh:"Model 2: Confirmation Entry (本质)",en:"Model 2: Confirmation Entry (Essence)"},diagram:"m9-confirmation-entry",bullets:{zh:["本质：不见兔子不撒鹰。让市场先证明自己，我们再跟随。","视觉特征：结构破坏 (CHOCH) + 动能缺口 (FVG) 的完美组合","心理学：放弃买在最低点/卖在最高点的执念，换取极高的确定性"],en:["Essence: Don't shoot until you see the whites of their eyes. Let the market prove itself first.","Visual: The perfect combo of Structure Shift (CHOCH) + Momentum Gap (FVG).","Psychology: Giving up the obsession of catching the exact top/bottom in exchange for extreme certainty."]},script:{zh:"第二种模型：确认入场。这是机构用得最多、最稳健的模型。它的本质是“让子弹先飞一会儿”。我们不猜底，我们等主力把底砸出来，并且强势拉升证明了自己之后，我们再上车！",en:`Model 2: Confirmation Entry. This is the most robust and heavily used institutional model. Its essence is "let the market show its hand." We don't guess bottoms; we wait for smart money to carve the bottom, aggressively push up to prove it, and THEN we get on board!`}},{id:"m9-s10",title:{zh:"Model 2: 完整的 4 步条件",en:"Model 2: The 4-Step Conditions"},diagram:"m9-confirmation-entry",bullets:{zh:["1. Sweep (扫荡)：必须先清扫大级别的流动性池","2. CHOCH (破坏)：必须强力突破最近的结构高/低点 (控制权转移)","3. Displacement (位移)：突破时必须是大实体 K 线，并留下 FVG","4. Retest (回踩)：价格温和回撤至 FVG 或 OB 区域"],en:["1. Sweep: Must first purge a HTF liquidity pool.","2. CHOCH: Must aggressively break the most recent structural H/L (Control Shift).","3. Displacement: The break must be full-bodied candles, leaving an FVG.","4. Retest: Price mildly retraces into the FVG or OB zone."]},script:{zh:"这四步，缺一不可！没有扫荡的 CHOCH 是假动作；没有 FVG 的 CHOCH 是动能不足；没有温和回踩的入场是追涨杀跌。必须像机器一样核对这四个条件！",en:"These four steps are non-negotiable! A CHOCH without a sweep is a fakeout; a CHOCH without an FVG lacks momentum; entering without a mild retest is just chasing. You must verify these four conditions like a machine!"}},{id:"m9-s11",title:{zh:"Model 2: 执行流程 (Execution Flow)",en:"Model 2: Execution Flow"},diagram:"m9-confirmation-entry",bullets:{zh:["挂单逻辑：在 FVG 的边缘 (或 OB 的开盘价) 提前挂 Limit 单","确认细节：回踩的过程必须是“缩量、小实体”的 K 线 (说明是获利盘回吐，不是反向攻击)","时间过滤：回踩最好发生在活跃交易时段的重叠区"],en:["Order Logic: Place a Limit order at the edge of the FVG (or OB open price).","Confirmation Detail: The retest MUST be low-volume, small-bodied candles (indicating profit-taking, not a counter-attack).","Time Filter: The retest ideally happens during active session overlaps."]},script:{zh:"当出现 FVG 后，你就可以安心地在 FVG 边缘挂单了。但要注意，回踩的姿势很重要！如果是一根巨大的阴线直接砸向你的多头 FVG，立刻撤单！我们要看到的是小碎步一样的温和回踩。",en:"Once the FVG forms, you can confidently place your limit order at its edge. But pay attention to the posture of the retest! If a giant red candle smashes directly into your bullish FVG, cancel the order immediately! We want to see a mild, small-stepping retracement."}},{id:"m9-s12",title:{zh:"Model 2: 止损、目标与失效",en:"Model 2: Stop, Target & Invalidation"},diagram:"m9-confirmation-entry",bullets:{zh:["止损位：放在 CHOCH 起点 (极值点) 的外部","第一目标：对侧的内部流动性 (最近的 FVG 或旧高低点)","失效逻辑：回踩时直接以大实体 K 线贯穿 FVG 并收盘在 FVG 之外 (动能延续失败)"],en:["Stop Loss: Outside the origin of the CHOCH (the extreme point).","First Target: Opposing internal liquidity (nearest FVG or old H/L).","Invalidation: The retest pierces the FVG with a full-bodied candle and closes outside it (Momentum continuation failure)."]},script:{zh:"确认模型的止损相对较宽，放在整个反转结构的最低点下方，这样能避免被噪音扫掉。如果价格不仅填补了 FVG，还大实体收在了 FVG 下方，说明多头根本没有防守，模型失效！",en:"The stop loss for the Confirmation model is relatively wider, placed below the absolute low of the reversal structure to avoid noise. If price not only fills the FVG but closes a full body below it, it means bulls aren't defending at all—model invalidated!"}},{id:"m9-s13",title:{zh:"为什么传统的“海龟汤”不够用了？",en:'Why Traditional "Turtle Soup" Fails Now'},diagram:"m9-turtle-soup",bullets:{zh:["传统海龟汤：只要跌破前低，立刻盲目做多","现代市场问题：算法极其狡猾，经常出现“扫了又扫” (Secondary Sweep)","散户痛点：做早了被二次扫荡打止损，做晚了错过行情"],en:["Traditional TS: Blindly long the exact moment it breaks a prior low.",'Modern Market Issue: Algorithms are ruthless, frequently executing "Secondary Sweeps".',"Retail Pain: Enter too early and get stopped by the second sweep; enter too late and miss the move."]},script:{zh:"ICT 早年提出的海龟汤非常经典，但现在的算法早就进化了！你以为跌破前低就是底？主力经常会再往下砸一次，把你止损打掉再拉升。这就是为什么我们要用 2025 年的改良版！",en:"ICT's original Turtle Soup was classic, but algorithms have evolved! You think breaking the prior low is the bottom? Smart money will often smash it down one more time, hunting your stop before rallying. This is why we use the 2025 improved version!"}},{id:"m9-s14",title:{zh:"Model 3: Turtle Soup +2 (定义)",en:"Model 3: Turtle Soup +2 (Definition)"},diagram:"m9-turtle-soup",bullets:{zh:["核心升级：不猜单次扫荡，等待“双重拒绝 (Double Rejection)”","条件 1：大级别扫荡关键流动性","条件 2：小级别出现第一次拒绝 (留下长影线或小 FVG)","条件 3：价格二次下探，但未能跌破第一次拒绝的极值，随后强力拉升"],en:['Core Upgrade: Stop guessing single sweeps; wait for "Double Rejection".',"Condition 1: HTF sweeps key liquidity.","Condition 2: LTF shows a first rejection (long wick or small FVG).","Condition 3: Price probes down a second time but FAILS to break the extreme of the first rejection, then rallies hard."]},script:{zh:"Turtle Soup +2 的精髓在于“+2”：我们要看两次测试！第一次测试是扫大级别的止损，第二次测试是确认主力真的在护盘。只有当第二次下探失败时，我们才入场！",en:'The essence of Turtle Soup +2 is the "+2": We want to see TWO tests! The first test sweeps the HTF stops; the second test confirms smart money is actually defending. We only enter when the second probe fails!'}},{id:"m9-s15",title:{zh:"Model 3: 执行与止损",en:"Model 3: Execution & Stop Loss"},diagram:"m9-turtle-soup",bullets:{zh:["入场点：第二次下探被拒绝，并突破第一次拒绝的“颈线”时市价追入","止损点：严格放在第二次下探的极值点外","优势：完美避开主力的“二次扫荡”陷阱，胜率极高"],en:['Entry: When the second probe is rejected and breaks the "neckline" of the first rejection, enter at market.',"Stop Loss: Strictly outside the extreme of the second probe.",'Pros: Perfectly avoids the smart money "secondary sweep" trap; extremely high win rate.']},script:{zh:"这个模型的入场稍微晚一点点，但换来的是极高的胜率！当价格突破两次拒绝之间的颈线时，就是空头彻底绝望的时刻，直接市价买入！止损就放在第二次低点的下方。",en:"This model enters slightly later, but trades that for an insanely high win rate! When price breaks the neckline between the two rejections, it's the moment bears completely despair—buy at market! Stop loss goes right below the second low."}},{id:"m9-s16",title:{zh:"三种模型如何选择？(环境决定武器)",en:"How to Choose? (Environment Dictates Weapon)"},diagram:"m9-model-selection",bullets:{zh:["震荡市 / 亚盘：优先 Model 1 (Manipulation)，快进快出，吃区间边缘","趋势市 / 伦敦盘：优先 Model 2 (Confirmation)，顺势回踩，吃大波段","关键新闻发布 / 纽约盘初：优先 Model 3 (Turtle Soup +2)，防二次上下乱扫"],en:["Ranging / Asian Session: Prioritize Model 1 (Manipulation). In and out fast, eat the range edges.","Trending / London Session: Prioritize Model 2 (Confirmation). Trend pullback, catch the big swing.","Major News / NY Open: Prioritize Model 3 (Turtle Soup +2). Protect against volatile secondary sweeps."]},script:{zh:"不要拿着锤子看什么都是钉子！震荡市用假突破，趋势市用确认回踩，遇到非农这种大新闻或者纽约刚开盘群魔乱舞的时候，用改良海龟汤防身！",en:"Don't be a guy with a hammer seeing everything as a nail! Use Manipulation in ranges, Confirmation in trends, and when NFP hits or NY opens with crazy volatility, use Improved Turtle Soup to protect yourself!"}},{id:"m9-s17",title:{zh:"三大模型一页通 (One-Page Cheat Sheet)",en:"The 3 Models One-Page Cheat Sheet"},diagram:"m9-overview",bullets:{zh:["Model 1: 扫荡 -> V型收回 -> 极窄止损 -> 极高盈亏比","Model 2: 扫荡 -> CHOCH -> FVG 回踩 -> 结构止损 -> 极高胜率","Model 3: 扫荡 -> 双重拒绝 -> 颈线突破 -> 极强防守"],en:["Model 1: Sweep -> V-Reclaim -> Ultra-tight Stop -> Extreme R:R.","Model 2: Sweep -> CHOCH -> FVG Retest -> Structural Stop -> Extreme Win Rate.","Model 3: Sweep -> Double Rejection -> Neckline Break -> Extreme Defense."]},script:{zh:"把这一页截图打印出来贴在屏幕旁边！每次想按鼠标的时候，问问自己：我现在到底在执行哪一个模型？如果哪个都不符合，就把手从鼠标上拿开！",en:"Screenshot this page, print it, and tape it next to your monitor! Every time you want to click the mouse, ask yourself: Which exact model am I executing right now? If it doesn't fit any, take your hand off the mouse!"}},{id:"m9-s18",title:{zh:"Module 9 核心结论",en:"Module 9 Core Conclusion"},diagram:"m9-overview",bullets:{zh:["执行力不是靠胆量，而是靠清晰的模型边界","没有流动性清扫，所有的入场模型都不成立","接受错过 (FOMO)：宁愿错过模糊的行情，绝不执行模型外的交易","专业交易员只做自己看得懂、能定义、能复现的 Setup"],en:["Execution isn't about guts; it's about clear model boundaries.","Without a liquidity sweep, NO entry model is valid.","Accept missing out (FOMO): Better to miss a blurry move than execute outside the model.","Professionals ONLY trade setups they can understand, define, and replicate."]},script:{zh:"总结一下！执行力差，根本原因是你不知道自己到底在等什么！有了这三个模型，你的交易就变成了流水线作业：看环境 -> 选模型 -> 等条件 -> 扣扳机。不符合模型？那就去睡觉！这才是专业交易！",en:"To summarize! Poor execution stems from not knowing exactly what you are waiting for! With these three models, your trading becomes an assembly line: Read environment -> Pick model -> Wait for conditions -> Pull trigger. Doesn't fit the model? Go to sleep! That is professional trading!"}}]},{id:"m10",title:{zh:"Module 10: 风险与仓位管理",en:"Module 10: Risk & Trade Management"},slides:[{id:"m10-s1",title:{zh:`Module 10 — Risk & Trade Management
机构真实风控（不是 1% 那种笑话）`,en:`Module 10 — Risk & Trade Management
Institutional Risk (Not the 1% Joke)`},diagram:"m10-overview",bullets:{zh:["动态止损、仓位分批、利润搬砖法：把分析变成可活下来的系统","零售交易者把风控理解成“亏少一点”","专业交易者把风控理解成“让正确的交易活下来，让错误的交易尽快失去资格”"],en:["Dynamic Stops, Scaling, Profit Extraction: Turn analysis into a survivable system",'Retail traders see risk management as "losing less"','Professionals see it as "letting right trades survive and killing wrong ones quickly"']},script:{zh:"欢迎来到第10模块。前面9个模块我们讲了结构、流动性、入场模型，但如果你没有这一章的知识，前面的技术分析再好，你依然会亏钱。专业交易员和散户最大的区别，不在于谁看图更准，而在于谁的风控系统更完善。今天我们讲真正的机构风控：动态止损、仓位分批和利润搬砖。",en:""}},{id:"m10-s2",title:{zh:"为什么“每单 1%”不是完整风控",en:'Why "1% Per Trade" is NOT Complete Risk Management'},diagram:"m10-mistakes",bullets:{zh:["1% 只回答“最多亏多少”，但没有回答：","为什么这里该止损？是技术性失效，还是只是噪音？","为什么这笔交易值得冒这个风险？","什么时候该减仓、锁利、留 runner？","同样 1%，A+ setup 和 B setup 为什么不该一视同仁？","风控是：失效定义 + 仓位表达 + 持仓管理 + 利润提取"],en:[`1% only answers "max loss", but doesn't answer:`,"Why stop here? Is it technical invalidation or just noise?","Why is this trade worth the risk?","When to trim, lock profits, or leave a runner?","Why treat A+ and B setups the same with 1%?","Risk is: Invalidation + Position Expression + Management + Extraction"]},script:{zh:"很多散户把风控简单理解为'每单亏1%'。这只是一个数字，它没有告诉你为什么在这里止损，为什么这笔交易值得做，以及浮盈后该怎么办。真正的风控是一个完整的系统，包含失效定义、仓位表达、持仓管理和利润提取。",en:""}},{id:"m10-s3",title:{zh:"专业风控的 4 大组成部分",en:"The 4 Pillars of Professional Risk Management"},diagram:"m10-four-pillars",bullets:{zh:["1. Invalidation Risk（失效风险）：我的交易逻辑在哪个位置真正被证明错了？","2. Position Risk（仓位风险）：用多大仓位表达这个观点？","3. Management Risk（管理风险）：持仓中如何调整、保护、再评估？","4. Extraction Risk（利润提取风险）：怎么把浮盈变成已实现收益，而不是吐回去？"],en:["1. Invalidation Risk: Where is my thesis actually proven wrong?","2. Position Risk: What size expresses this view?","3. Management Risk: How to adjust, protect, and re-evaluate while in the trade?","4. Extraction Risk: How to turn paper profits into realized gains without giving them back?"]},script:{zh:"专业风控由四大支柱构成。第一，失效风险：你的逻辑在哪里被证明是错的？第二，仓位风险：用多大仓位来表达这个观点？第三，管理风险：持仓过程中如何根据新信息调整？第四，提取风险：怎么把账面浮盈变成落袋为安的现金？",en:""}},{id:"m10-s3a",title:{zh:"R乘数的力量 (The Power of R-Multiple)",en:"The Power of R-Multiple"},diagram:"m10-r-multiple",bullets:{zh:["把风险标准化：无论账户大小，单笔最大风险永远定义为 1R","止损 = -1R，盈利 = +2R 或 +3R","把交易从“情绪化的金钱博弈”变成“标准化的概率游戏”","不要用绝对金额思考，用 R 思考"],en:["Standardize risk: Regardless of account size, max risk per trade is 1R","Stop Loss = -1R, Target = +2R or +3R",'Turns trading from "emotional money gambling" to a "standardized probability game"',"Think in R, not in absolute dollars"]},script:{zh:"在进入具体操作前，我们先统一语言：R乘数。不管你的账户是1千还是10万，我们都把单笔最大风险定义为 1R。止损就是负 1R，盈利就是正 2R 或 3R。这样你的交易就变成了标准化的概率游戏，而不是情绪化的金钱博弈。",en:""}},{id:"m10-s3b",title:{zh:"仓位计算公式 (Position Sizing Formula)",en:"Position Sizing Formula"},diagram:"m10-position-sizing",bullets:{zh:["如何保证每次亏损都是准确的 1R？使用仓位计算公式","公式：仓位大小 = (账户余额 × 风险比例) / (止损点数 × 每点价值)","止损空间小（如 20 pips），仓位可以大；止损空间大（如 40 pips），仓位必须小","永远先确定止损位置，再反推仓位大小"],en:["How to ensure every loss is exactly 1R? Use the sizing formula","Formula: Lot Size = (Balance × Risk%) / (Stop Pips × Pip Value)","Tight stop (20 pips) = Larger size; Wide stop (40 pips) = Smaller size","ALWAYS determine stop placement first, then calculate size"]},script:{zh:"怎么保证每次亏损都是准确的 1R？你需要使用仓位计算公式。如果止损空间小，你可以下大一点的仓位；如果止损空间大，你必须缩小仓位。永远是先确定止损位置，再反推仓位大小，而不是凭感觉下单。",en:""}},{id:"m10-s3c",title:{zh:"非对称性：胜率与盈亏比 (Asymmetry)",en:"Asymmetry: Win Rate vs R:R"},diagram:"m10-asymmetry",bullets:{zh:["为什么追求高盈亏比？因为非对称性优势","1:1 盈亏比需要 50% 胜率才能保本","1:3 盈亏比只需要 25% 胜率就能保本","高盈亏比允许你“错很多次”，只要对一次就能覆盖亏损","这就是为什么专业交易员宁愿错过，也不做盈亏比差的交易"],en:["Why aim for high R:R? The power of asymmetry","1:1 R:R requires 50% win rate just to breakeven","1:3 R:R requires only 25% win rate to breakeven",'High R:R allows you to be "wrong often" and still be profitable',"This is why pros skip bad R:R setups rather than forcing a trade"]},script:{zh:"为什么我们要追求高盈亏比？因为这是非对称性的力量。如果你每笔交易能赚 3R，你只需要 25% 的胜率就能保本。这意味着你可以错很多次，只要对一次就能赚回来。这就是为什么我们宁愿错过，也不做 1比1 的交易。",en:""}},{id:"m10-s3d",title:{zh:"回撤应对机制 (Drawdown Protocol)",en:"Drawdown Protocol"},diagram:"m10-drawdown",bullets:{zh:["面对连续亏损，专业的做法是动态缩减风险","例如：正常风险 1%；回撤达 5% 时，风险降至 0.5%；回撤达 10% 时，风险降至 0.25%","效果：在数学上几乎不可能爆仓，强迫你在状态差时减少破坏","活着，是交易的第一法则"],en:["When facing a losing streak, pros dynamically reduce risk","Example: Normal risk 1%; At -5% DD, risk drops to 0.5%; At -10% DD, risk drops to 0.25%","Effect: Mathematically impossible to blow the account; limits damage during bad streaks","Survival is the first rule of trading"]},script:{zh:"面对连续亏损怎么办？专业的做法是动态调整风险。比如回撤达到 5% 时，把每单风险从 1% 降到 0.5%。回撤 10% 时降到 0.25%。这样在数学上，你几乎不可能爆仓。活着，是交易的第一法则。",en:""}},{id:"m10-s4",title:{zh:"真正的止损：不是固定点数，而是结构失效",en:"True Stop Loss: Structural Invalidation, Not Fixed Pips"},diagram:"m10-stop-loss",bullets:{zh:["止损不是为了少亏，而是为了在“交易逻辑失效”时退出","止损应该放在：你的交易 thesis 被证明错误的位置","而不是“我能承受多少点”的位置，也不是“别人说 10 点就够”的位置","好止损 = 正常噪音能活，真正失效会死","烂止损 = 噪音都活不了，失效时却又舍不得认错"],en:[`Stops aren't to lose less, but to exit when the "trade thesis is invalid"`,"Stops belong where your thesis is proven wrong",'Not where "you can afford" or "someone said 10 pips is enough"',"Good Stop = Survives noise, dies on true invalidation","Bad Stop = Dies to noise, refuses to admit wrong on invalidation"]},script:{zh:"接下来讲第一支柱：止损。真正的止损，绝对不是固定设置 10个点或20个点。止损应该放在'你的交易逻辑被证明错误'的位置。好的止损，能扛过正常的市场噪音，但一旦逻辑失效，它会果断带你离场。",en:""}},{id:"m10-s5",title:{zh:"3 类止损：先分清你到底在保护什么",en:"3 Types of Stops: Know What You Are Protecting"},diagram:"m10-stop-types",bullets:{zh:["1. 技术止损：放在最近执行结构之外 (如 FVG/OB 下方、sweep extreme 外)","2. 结构止损：放在 market structure 关键失效位之外 (如 reclaim 再失守、range 边界重新被吞没)","3. Thesis 止损：放在“整个交易叙事失效”的位置 (如押注 manipulation 完成，结果市场重新接受突破方向)","Scalping 常用技术止损；Swing 更依赖结构与 thesis 止损"],en:["1. Technical Stop: Outside recent execution structure (below FVG/OB, outside sweep extreme)","2. Structural Stop: Outside key market structure invalidation (reclaim lost, range boundary engulfed)",'3. Thesis Stop: Where the "entire narrative fails" (e.g., manipulation fails and market accepts breakout)',"Scalping uses Technical; Swing relies on Structural & Thesis stops"]},script:{zh:"止损分为三类。技术止损放在执行结构（比如 FVG 或 OB）之外；结构止损放在关键的市场结构失效位；逻辑止损则是整个交易叙事被证伪的地方。做短线多用技术止损，做波段多用结构和逻辑止损。",en:""}},{id:"m10-s6",title:{zh:"动态止损：什么时候该收，什么时候不该动",en:"Dynamic Stops: When to Trail and When to Hold"},diagram:"m10-dynamic-stop",bullets:{zh:["动态止损不是“有浮盈就赶紧保本”，而是“市场已经给出新的失效信息”才调整","可以移动：市场已完成明确结构推进、新的高/低点被确认、原 thesis 已部分兑现","不该乱动：仅仅因为浮盈一点点想保本、市场还在正常 pullback 范围内、你只是情绪不舒服","止损的移动，必须基于“信息更新”，不能基于“情绪波动”"],en:[`Dynamic stops aren't "breakeven ASAP", but adjusting when "market gives new invalidation info"`,"When to move: Clear structural progression, new H/L confirmed, thesis partially fulfilled","When NOT to move: Just want breakeven on small profit, normal pullback, emotional discomfort",'Stop movement MUST be based on "information update", not "emotional swings"']},script:{zh:"入场后，止损不是死板的。我们需要动态止损。但请记住，移动止损的唯一理由是'市场给出了新的结构信息'，比如突破了前高前低。绝对不能因为你害怕利润回吐，或者仅仅为了'保本'而盲目移动止损。",en:""}},{id:"m10-s7",title:{zh:"动态止损 4 法",en:"4 Methods of Dynamic Trailing"},diagram:"m10-trailing-methods",bullets:{zh:["1. 结构跟踪止损：跟随新形成的 HL/LH、reclaim/loss 位置移动 (适合 trend continuation)","2. 执行区更新止损：新的 FVG/OB 成立后，把止损移到新无效位之外 (适合 confirmation entry)","3. 目标完成后减仓+缩风险：第一流动性目标完成后，把剩余仓位止损收紧 (适合 reversal 到 target)","4. 时间型止损收缩：预期 move 应该快速走，但长时间不走，可主动收紧 (适合 intraday model)"],en:["1. Structural Trailing: Trail behind new HL/LH, reclaim/loss (Trend continuation)","2. Execution Zone Update: Move stop outside new FVG/OB invalidation (Confirmation entry)","3. Target Hit + Risk Reduction: Tighten stop on runner after first liquidity target (Reversal to target)","4. Time-Based Tightening: Expected fast move stalls, actively tighten (Intraday models)"]},script:{zh:"这里有四种实用的动态止损方法。第一是跟随新形成的 HL 或 LH 移动；第二是随着新的执行区成立而更新；第三是到达第一目标位后收紧剩余仓位的止损；第四是时间型收缩，如果预期该爆发的行情迟迟不动，主动收紧风险。",en:""}},{id:"m10-s8",title:{zh:"什么时候直接保本，什么时候绝对不能保本",en:"When to Breakeven vs When NEVER to Breakeven"},diagram:"m10-breakeven",bullets:{zh:["保本不是美德，很多时候它只是让你系统性错过大盈亏比","适合保本：第一关键目标已完成、市场完成一次明确 displacement、关键风险事件前","不适合保本：刚进场不久还在正常波动、你的 entry model 本来就允许 deeper retest、结构尚未形成新的保护点","“保本太早”其实是系统性亏损来源"],en:["Breakeven isn't a virtue; it often systematically robs you of big R:R","Good for BE: First key target hit, clear displacement completed, before key risk events","Bad for BE: Just entered/normal volatility, model allows deeper retest, no new structural protection",'"Premature Breakeven" is a source of systematic losses']},script:{zh:"关于'保本'，很多新手喜欢一有浮盈就推保本，这其实是系统性亏损的来源，因为你会被正常的波动扫出局，然后错过大行情。只有在完成第一目标、或者市场出现明确的 displacement 之后，才适合推保本。",en:""}},{id:"m10-s9",title:{zh:"仓位分批：真正专业的持仓表达方式",en:"Scaling: The Professional Way to Express Conviction"},diagram:"m10-scaling",bullets:{zh:["仓位不是只有“有”或“没有”，仓位应该表达你的确定性层级","允许你先试探，再确认","允许你在不同证据层级下注不同权重","允许你同时兼顾：初始位置优势、确认后的加仓、风险控制、心理稳定","分批仓位不是犹豫，是把不确定性拆开管理"],en:["Positions aren't binary; they should express your level of certainty","Allows you to probe first, then confirm","Allows different weights for different evidence levels","Balances: Initial location edge, confirmation add-ons, risk control, psychology","Scaling isn't hesitation; it's unbundling uncertainty"]},script:{zh:"第二支柱：仓位分批。仓位不应该是 0 或 100，它应该表达你的确定性层级。分批建仓允许你先用小仓位试探，等市场给出确认信号后再加仓。这不是犹豫，而是把不确定性拆解开来，分步管理。",en:""}},{id:"m10-s10",title:{zh:"最实用的 3 种分批建仓方式",en:"3 Practical Scaling-In Models"},diagram:"m10-scaling-models",bullets:{zh:["1. Probe → Confirm → Press：先小仓试探，看到 reclaim/displacement 后加，进入 commitment move 后再加 (适合 manipulation/reversal)","2. Core + Add-on：先建立核心仓位，回踩高质量 execution zone 时加仓 (适合顺势 continuation)","3. Two-Layer Entry：第一层在 zone edge，第二层在 deeper fill / midpoint / confirmation (适合 OB/FVG 精细化执行)"],en:["1. Probe → Confirm → Press: Small probe, add on reclaim/disp, press on commitment (Manipulation/Reversal)","2. Core + Add-on: Build core, add on high-quality execution zone retests (Trend continuation)","3. Two-Layer Entry: Layer 1 at zone edge, Layer 2 at deeper fill/midpoint/confirmation (OB/FVG refinement)"]},script:{zh:"最实用的三种分批建仓模型：第一种是试探-确认-重仓，非常适合做反转或扫损模型；第二种是核心仓位加顺势加仓，适合趋势延续；第三种是双层入场，在订单块的边缘进一层，深回踩再进一层，用来优化均价。",en:""}},{id:"m10-s11",title:{zh:"分批加仓和“补亏损”不是一回事",en:'Scaling In vs "Averaging Down a Loser"'},diagram:"m10-scaling-vs-averaging",bullets:{zh:["加仓的前提，是 thesis 更强了；不是你被套了","可以加仓：新证据出现、displacement 后回踩有效、reclaim 后 acceptance 更强、风险已被部分锁定","绝对不能加仓：因为亏损想摊低成本、因为“不甘心”、市场没有提供新确认、原 thesis 已经变弱甚至失效"],en:["Add ONLY when the thesis gets stronger, not when you are trapped","When to add: New evidence, valid retest after disp, stronger acceptance after reclaim, risk partially locked","NEVER add: To average down cost, out of stubbornness, no new confirmation, thesis weakening/invalidated"]},script:{zh:"这里必须强调：分批加仓和散户的'死扛补仓'有本质区别。加仓的前提是你的交易逻辑变得更强了，市场给了新的确认；而补亏损是因为你被套牢了，不甘心认输。永远不要在逻辑变弱时加仓！",en:""}},{id:"m10-s12",title:{zh:"利润搬砖法：把浮盈变成现金流",en:"Profit Extraction: Turning Paper Profits into Cash Flow"},diagram:"m10-profit-extraction",bullets:{zh:["不是一次性平仓，而是把市场给的利润一块一块搬回账户","市场不会总给你完美顶部/底部","一次性全平常常：提前下车，或吐回大量浮盈","目标：先实现部分盈利，降低持仓心理压力，给 runner 留空间，在不牺牲系统稳定性的前提下，吃到大波段"],en:["Not an all-at-once exit, but moving profits from the market to your account piece by piece","The market rarely gives you the perfect top/bottom","All-or-nothing exits often lead to: leaving early, or giving back massive paper profits","Goal: Realize partials, reduce psychology pressure, leave room for runners, catch big swings without sacrificing stability"]},script:{zh:"第三支柱：利润提取，也就是利润搬砖法。市场很少会给你完美的逃顶或抄底机会。一次性全平，要么下车太早，要么眼睁睁看着巨额浮盈化为乌有。专业的做法是，像搬砖一样，把市场的钱分批搬进自己的账户。",en:""}},{id:"m10-s13",title:{zh:"最实用的利润搬砖 3 段法",en:"The 3-Stage Profit Extraction Method"},diagram:"m10-extraction-stages",bullets:{zh:["第 1 段：First Paycheck (平 30%-50%) - 到达第一个高概率 target (最近 liquidity pool / 1R-2R)。目的：把纸面利润变成已实现利润","第 2 段：Structure Lock (平 20%-40%) - 市场完成关键结构推进后。目的：锁定核心盈利","第 3 段：Runner (留 10%-30%) - 给扩展目标，用结构跟踪或 execution zone 更新来管理。目的：抓住少数大行情"],en:["Stage 1: First Paycheck (30-50%) - At first high-prob target (recent liquidity / 1-2R). Goal: Realize paper profits","Stage 2: Structure Lock (20-40%) - After key structural progression. Goal: Lock core profits","Stage 3: Runner (10-30%) - For extended targets, managed via structural trailing. Goal: Catch the big outliers"]},script:{zh:"利润搬砖三段法：第一段叫 First Paycheck，在最近的高概率目标位平掉 30%到50%，把纸面富贵变成真金白银；第二段在结构推进后锁定核心利润；第三段留 10%到30% 的 Runner 仓位，去博弈尾部的大行情。",en:""}},{id:"m10-s14",title:{zh:"利润搬砖的目标怎么定",en:"How to Set Profit Extraction Targets"},diagram:"m10-extraction-targets",bullets:{zh:["不是看到浮盈就搬砖，而是在“市场最可能给出反应”的地方搬砖","目标优先级：最近显性 liquidity pool > 区间对侧边界 > HTF old high/low > measured move > session target","高级原则：第一段搬砖优先保守；第二段搬砖看结构进展；Runner 交给市场决定，而不是交给幻想决定"],en:[`Don't extract just because you see green; extract where "market is most likely to react"`,"Target Priority: Recent obvious liquidity > Opposite range boundary > HTF old H/L > Measured move > Session target","Pro Principles: 1st extraction is conservative; 2nd depends on structure; Runner is decided by the market, not fantasy"]},script:{zh:"搬砖的目标怎么定？不要一看到绿色浮盈就平仓，要在'市场最可能发生反应'的地方平仓。比如最近的流动性池、区间的对侧边界、或者更高时间级别的高低点。第一目标保守一点，Runner 目标可以激进一点。",en:""}},{id:"m10-s15",title:{zh:"交易管理：4 个管理决策点",en:"Trade Management: 4 Decision Points"},diagram:"m10-management-decisions",bullets:{zh:["持仓之后，你真正要做的不是盯盘，而是做 4 个管理决策：","1. Trade is working? 市场是否按预期推进？","2. Risk can be reduced? 是否有新信息支持收紧风险？","3. Profit should be extracted? 是否到达高概率反应区？","4. Thesis still valid? 原交易逻辑是否还成立？"],en:["After entering, don't just stare at the chart. Make 4 decisions:","1. Trade is working? Is the market progressing as expected?","2. Risk can be reduced? Is there new info to tighten risk?","3. Profit should be extracted? Reached a high-prob reaction zone?","4. Thesis still valid? Is the original logic still intact?"]},script:{zh:"持仓过程中的管理，其实就是不断问自己四个问题：交易还在按预期推进吗？有新信息支持我减小风险吗？到高概率反应区该提取利润了吗？我最初的交易逻辑还成立吗？",en:""}},{id:"m10-s16",title:{zh:"什么是“交易在工作中”",en:'What Does "Trade is Working" Mean?'},diagram:"m10-trade-working",bullets:{zh:["好的交易通常不会让你太怀疑它自己","在工作中：入场后较快表现出预期方向、pullback 质量健康、displacement 保持、关键结构没有立刻失守","不在工作中：长时间卡住、反复穿越执行区、该走不走、displacement 很快被吞没、结构变差","不是所有亏损都该等止损；有些交易在止损之前，就已经失去“继续持有的资格”"],en:["Good trades rarely make you doubt them too much","Working: Moves in expected direction quickly, healthy pullbacks, disp holds, key structure intact","Not Working: Stuck for long, chops through execution zone, fails to move, disp engulfed quickly",'Not all losses should hit the stop; some trades lose the "right to be held" before the stop is hit']},script:{zh:"什么是'交易在工作中'？好的交易通常很快就会证明自己，会有健康的 pullback 和持续的 displacement。如果一笔交易长时间卡住，反复穿越你的入场区，那它就已经不在'工作状态'了。",en:""}},{id:"m10-s17",title:{zh:"主动退出：什么时候该在止损前先走",en:"Active Exit: When to Leave Before the Stop"},diagram:"m10-active-exit",bullets:{zh:["有些交易虽然还没打止损，但已经不值得继续持有","可主动退出：thesis 核心假设失效、时间型失效(该走不走)、反向 displacement 出现、关键 acceptance 失去","注意：主动退出不是情绪化砍单，而是基于新的市场信息做再评估"],en:["Some trades aren't worth holding even if the stop isn't hit yet","When to exit: Core thesis fails, Time-based failure (stalls), Opposite displacement appears, Key acceptance lost","Note: Active exit is NOT emotional cutting; it is re-evaluation based on NEW market info"]},script:{zh:"这就引出了'主动离场'。不是所有的亏损都必须等到打止损。如果核心逻辑已经失效，或者时间上该走不走，出现了反向的强劲动能，你应该在打止损前主动离场。这不是情绪化砍单，而是基于新信息的理性决策。",en:""}},{id:"m10-s18",title:{zh:"A / B / C setup 风险分级",en:"A / B / C Setup Risk Grading"},diagram:"m10-risk-grading",bullets:{zh:["不是每一笔交易都配拿同样的风险权重","A+ setup: 6/8 或 7/8 以上证据叠加 (HTF + liquidity + displacement + timing 共振) -> 标准或略高风险","B setup: 5/8 左右，逻辑可做，但非最优 -> 中等或轻仓","C setup: 证据不足 -> 只适合观察，通常不做","风险不是平均分配给每一单，风险应该分配给最有优势的机会"],en:["Not every trade deserves the same risk weight","A+ Setup: 6/8+ evidence confluence (HTF+Liq+Disp+Timing) -> Standard or slightly higher risk","B Setup: ~5/8 evidence, logical but not optimal -> Medium or light size","C Setup: Lacking evidence -> Observe only, usually no trade","Risk isn't distributed equally; it's allocated to the highest edge opportunities"]},script:{zh:"最后，我们要对交易机会进行风险分级。A+ 级别的 Setup，各种条件共振，值得你用标准的 1R 甚至略高的风险去博弈；B 级 Setup 缺少一些确认，只能用半仓；C 级直接放弃。把子弹留给最好的猎物。",en:""}},{id:"m10-s19",title:{zh:"Module 10 核心结论",en:"Module 10 Core Conclusion"},diagram:"m10-overview",bullets:{zh:["风控不是“每单 1%”这么简单，它包含：失效定义、仓位表达、动态止损、利润提取","止损应基于结构失效，而不是情绪舒适度","动态止损必须基于新信息，而不是害怕回吐","分批建仓可以表达确定性层级，利润搬砖法能把浮盈稳定变成已实现收益","风控的目标不是“不亏”，而是让亏损可控，让盈利可扩张","交易里真正的高级，不是看图更玄，而是把亏损设计得很专业，把盈利提取得很系统"],en:[`Risk isn't just "1%"; it's Invalidation, Sizing, Dynamic Stops, and Extraction`,"Stops are based on structural invalidation, not emotional comfort","Dynamic stops require new info, not fear of giving back profits","Scaling expresses certainty; Profit extraction turns paper gains into realized cash",`The goal isn't "no losses", but controlled losses and expandable profits`,"True mastery isn't complex charting; it's professional loss design and systematic profit extraction"]},script:{zh:"总结一下第10模块：风控是一个完整的系统。止损基于结构，移动止损基于新信息，仓位分批表达确定性，利润搬砖法锁定收益。交易的高级境界，就是把亏损设计得极其专业，把盈利提取得极其系统。我们下一章，交易心理学见！",en:""}}]},{id:"m11",title:{zh:"Module 11: Psychological Sequence",en:"Module 11: Psychological Sequence"},slides:[{id:"m11-s1",title:{zh:"Module 11 — Psychological Sequence\\n机构在每轮行情中故意制造的 5 个散户情绪阶段",en:"Module 11 — Psychological Sequence\\nThe 5 Emotional Stages Institutions Intentionally Create"},diagram:"m11-intro",bullets:{zh:["真正的市场操控，不只是扫流动性，更是设计情绪路径","不是先有情绪再有价格，而是价格路径本身就在制造情绪","市场不是随机让散户情绪失控","市场往往是在“最需要流动性的时候”，故意把情绪推到最极端"],en:["True market manipulation is not just sweeping liquidity, but designing emotional paths","Price paths create emotions, not the other way around","The market does not randomly make retail traders lose control","The market intentionally pushes emotions to extremes exactly when it needs liquidity the most"]},script:{zh:"欢迎来到模块11。市场不是随机让散户情绪失控，市场往往是在“最需要流动性的时候”，故意把情绪推到最极端。这句话能一下把“心理学”拉回交易逻辑。真正的市场操控，不只是扫流动性，更是设计情绪路径。",en:"Welcome to Module 11. The market doesn't randomly make retail traders lose control of their emotions. It intentionally pushes emotions to the extreme exactly when it needs liquidit
