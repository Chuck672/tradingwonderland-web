y the most. This module shifts our focus from just price action to participant behavior."}},{id:"m11-s2",title:{zh:"为什么要学情绪序列？\\n专业交易者不只看图形，还看“下一波情绪最可能在哪里被触发”",en:"Why Study Emotional Sequences?\\nProfessionals look for where the next wave of emotion will be triggered"},diagram:"m11-concept",bullets:{zh:["情绪是可预测的，群体反应是可利用的","大部分止损、追价、扛单、爆仓，都不是随机发生","它们常常在固定类型的位置集中出现","爆仓往往是结构性事件，不是个体不幸","流动性从来不只是订单的堆积，它更是人群情绪在图表上的集体落点"],en:["Emotions are predictable, crowd reactions are exploitable","Most stop-outs, chasing, holding losing trades, and liquidations don't happen randomly","They cluster at specific locations","Liquidations are structural events, not individual misfortunes","Liquidity is never just an accumulation of orders; it's the collective footprint of crowd emotion on the chart"]},script:{zh:"为什么要学情绪序列？因为大部分止损、追价、扛单、爆仓，都不是随机发生，它们常常在固定类型的位置集中出现。这意味着情绪是可预测的，群体反应是可利用的。流动性从来不只是订单的堆积，它更是人群情绪在图表上的集体落点。我们要把“心理”这件事专业化、交易化。",en:"Why study emotional sequences? Because most stop-outs, chasing, holding losing trades, and liquidations don't happen randomly. They cluster at specific locations. Liquidity is never just an accumulation of orders; it's the collective footprint of crowd emotion on the chart."}},{id:"m11-s3",title:{zh:"情绪序列和价格序列是一体的\\n价格怎么走，决定情绪怎么演化；情绪怎么演化，又反过来决定流动性怎么堆积",en:"Emotional Sequence and Price Sequence are One\\nPrice movement creates expectations, which build liquidity"},diagram:"m11-chain",bullets:{zh:["情绪与流动性的转化链条","价格推动 → 形成预期 → 预期一致 → 仓位集中","仓位集中 → 流动性堆积 → 更容易被利用","被利用后 → 情绪崩塌或 FOMO 爆发 → 推动下一段 move"],en:["The Conversion Chain of Emotion and Liquidity","Price movement → Forms expectations → Uniform expectations → Concentrated positioning","Concentrated positioning → Liquidity builds up → Easier to exploit","Exploitation → Emotional collapse or FOMO → Fuels the next move"]},script:{zh:"价格怎么走，决定情绪怎么演化；情绪怎么演化，又反过来决定流动性怎么堆积。价格推动形成预期，预期一致导致仓位集中，进而形成流动性堆积。被利用后，情绪崩塌或FOMO爆发，从而推动下一段行情。这是连接前面所有模块和本章的桥梁。",en:"Price sequence and emotional sequence are one. Price movement creates expectations. Uniform expectations lead to concentrated positioning. Concentrated positioning builds liquidity. Built liquidity is easily exploited. Exploitation leads to emotional collapse or FOMO, which in turn fuels the next move."}},{id:"m11-s4",title:{zh:"五个情绪阶段总览\\n每一轮高质量行情里，最常被制造出来的 5 个散户情绪阶段",en:"Overview of the 5 Emotional Stages\\nThe 5 stages most commonly engineered in high-quality moves"},diagram:"m11-emotion-cycle",bullets:{zh:["机构最常利用的 5 个散户情绪阶段","1. Curiosity & Recognition（注意 / 识别阶段）","2. Belief & Commitment（相信 / 建仓阶段）","3. Stress & Rationalization（压力 / 扛单合理化阶段）","4. Panic & Capitulation（恐慌 / 认输爆仓阶段）","5. Revenge & Misread Reversal（报复 / 错误反手阶段）","市场最擅长的，不是让你看不懂，而是让你一步一步“越看越懂”，直到你重仓死在最差位置"],en:["The 5 Retail Emotional Stages Most Exploited by Institutions","1. Curiosity & Recognition","2. Belief & Commitment","3. Stress & Rationalization","4. Panic & Capitulation","5. Revenge & Misread Reversal","The market's greatest trick isn't being incomprehensible; it's making you feel like you understand it more and more, right up until you go heavily into a position at the worst possible spot"]},script:{zh:"每一轮高质量行情里，最常被制造出来的 5 个散户情绪阶段：注意、相信、压力、恐慌、报复。市场最擅长的，不是让你看不懂，而是让你一步一步“越看越懂”，直到你重仓死在最差位置。这五个阶段构成了完整的流动性收割循环。",en:"Here are the 5 emotional stages retail traders go through: Curiosity, Belief, Stress, Panic, and Revenge. The market's greatest trick isn't being incomprehensible; it's making you feel like you understand it more and more, right up until you go heavily into a position at the worst possible spot."}},{id:"m11-s5",title:{zh:"Stage 1: Curiosity & Recognition\\n注意 / 识别阶段：市场先让你“看到一个很合理的故事”",en:'Stage 1: Curiosity & Recognition\\nThe market first makes you "see a very reasonable story"'},diagram:"m11-stage1",bullets:{zh:["散户在想什么？","“这里是不是一个不错的 setup？”","“趋势好像很清楚”，“这个 OB / FVG / 支撑位挺漂亮”","“如果回踩这里，应该可以做吧？”","市场在做什么？","搭建可识别结构，创造 textbook narrative","让更多人看到同一个方向，积累潜在的参与者（未来的流动性）"],en:["What are retail traders thinking?",'"Is this a good setup?"','"The trend looks clear", "This OB / FVG / Support looks nice"','"If it pulls back here, I should take it, right?"',"What is the market doing?","Building recognizable structures, creating textbook narratives","Making more people see the same direction, accumulating potential participants (future liquidity)"]},script:{zh:"第一阶段，注意与识别。散户开始注意到一个看似完美的setup，比如一个漂亮的支撑位或FVG。市场此时正在搭建可识别结构，创造教科书般的叙事，目的是让更多人看到同一个方向，积累潜在的参与者，也就是未来的流动性。",en:"Stage 1: Curiosity & Recognition. Retail traders start noticing a seemingly perfect setup, like a nice support level or FVG. The market is building recognizable structures and creating textbook narratives to make more people see the same direction, accumulating potential participants—future liquidity."}},{id:"m11-s6",title:{zh:"Stage 2: Belief & Commitment\\n相信 / 建仓阶段：给你一点甜头，让你确认“我是对的”",en:'Stage 2: Belief & Commitment\\nGiving you a little taste to confirm "I am right"'},diagram:"m11-stage2",bullets:{zh:["散户在想什么？","“进场了！果然涨了！”","“加仓！不能错过这波大行情。”","“止损设在结构下方，很安全。”","市场在做什么？","提供初步的顺向移动 (Initial Reaction)","确认散户的偏见，诱导他们投入真实的资金和止损订单","在结构点外侧（上方/下方）形成密集的 Stop Loss 资金池"],en:["What are retail traders thinking?",`"I'm in! It's going up as expected!"`,`"Adding to my position! Can't miss this big move."`,'"Stop loss placed below structure, very safe."',"What is the market doing?","Providing an initial favorable move (Initial Reaction)","Confirming retail bias, inducing them to commit real capital and stop-loss orders","Forming dense Stop Loss pools outside structural points (above/below)"]},script:{zh:"第二阶段，相信与建仓。散户进场后，市场会给一点初步的顺向移动，让散户觉得“我是对的”，甚至加仓。止损被安全地设在结构下方。市场这样做的目的是确认散户的偏见，诱导他们投入真实的资金，并在结构点外侧形成密集的止损资金池。",en:"Stage 2: Belief & Commitment. After retail enters, the market provides an initial favorable move, making them feel 'I am right' and prompting them to add to their positions. Stops are safely placed below structure. The market's goal is to confirm their bias, induce real capital commitment, and form dense stop-loss pools outside structural points."}},{id:"m11-s7",title:{zh:"Stage 3: Stress & Rationalization\\n压力 / 扛单合理化阶段：行情停滞或反向，开始自我欺骗",en:"Stage 3: Stress & Rationalization\\nTrend stalls or reverses, self-deception begins"},diagram:"m11-stage3",bullets:{zh:["散户在想什么？","“只是正常回调，大趋势还在。”","“还没扫到我的止损，再等等。”","“可能只是洗盘，不能被洗下车。”","市场在做什么？","价格开始缓慢或突然反向，逼近散户的止损区","制造不确定性，测试持有者的信念","将那些“不坚定的筹码”提前洗出，同时让“死扛的筹码”越陷越深"],en:["What are retail traders thinking?",'"Just a normal pullback, the macro trend is still intact."',`"Hasn't hit my stop yet, wait a bit longer."`,`"Probably just a shakeout, can't get shaken out."`,"What is the market doing?","Price starts slowly or suddenly reversing, approaching retail stop-loss zones","Creating uncertainty, testing holders' conviction",'Washing out "weak hands" early, while making "diamond hands" sink deeper']},script:{zh:"第三阶段，压力与合理化。行情开始停滞或反向，逼近止损区。散户开始自我欺骗，认为这只是正常回调或洗盘。市场此时在制造不确定性，测试持有者的信念，洗出不坚定的筹码，同时让死扛的筹码越陷越深。",en:"Stage 3: Stress & Rationalization. The trend stalls or reverses, approaching stop-loss zones. Retail traders start rationalizing, thinking it's just a normal pullback or shakeout. The market is creating uncertainty, testing conviction, washing out weak hands, and making stubborn holders sink deeper."}},{id:"m11-s8",title:{zh:"Stage 4: Panic & Capitulation\\n恐慌 / 认输爆仓阶段：流动性被无情收割",en:"Stage 4: Panic & Capitulation\\nLiquidity is ruthlessly harvested"},diagram:"m11-stage4",bullets:{zh:["散户在想什么？","“完了，破位了！”","“止损被打掉了 / 爆仓了。”","“这市场太恶心了，我认输。”","市场在做什么？","价格加速刺穿关键结构（Sweep）","触发大量 Stop Loss 订单（市价单），为机构的真实方向提供充足的对手盘","完成流动性获取（Liquidity Grab）"],en:["What are retail traders thinking?",`"It's over, support broke!"`,'"Stop loss hit / Liquidated."','"This market is disgusting, I give up."',"What is the market doing?","Price accelerates through key structures (Sweep)","Triggering massive Stop Loss orders (market orders), providing ample counter-party liquidity for the institution's true direction","Completing the Liquidity Grab"]},script:{zh:"第四阶段，恐慌与认输。价格加速刺穿关键结构，触发大量止损单或爆仓。散户绝望认输。市场此时正在完成流动性获取，散户的止损市价单为机构的真实方向提供了充足的对手盘。",en:"Stage 4: Panic & Capitulation. Price accelerates through key structures, triggering massive stop-loss orders or liquidations. Retail traders despair and give up. The market is completing its liquidity grab; retail stop-market orders provide ample counter-party liquidity for the institution's true direction."}},{id:"m11-s9",title:{zh:"Stage 5: Revenge & Misread Reversal\\n报复 / 错误反手阶段：成为下一段行情的燃料",en:"Stage 5: Revenge & Misread Reversal\\nBecoming fuel for the next move"},diagram:"m11-stage5",bullets:{zh:["散户在想什么？","“既然跌破了，那肯定是空头趋势了，追空！”","“我要把刚才亏的赚回来。”","市场在做什么？","机构在拿到流动性后，迅速向真实方向反转（Displacement）","散户在最低点追空，再次被套","散户的新止损（空头止损）又成了推动价格上涨的燃料"],en:["What are retail traders thinking?",'"Since it broke down, it must be a bearish trend, short it!"','"I need to make back what I just lost."',"What is the market doing?","After grabbing liquidity, institutions rapidly reverse in the true direction (Displacement)","Retail shorts at the absolute low, getting trapped again","Retail's new stop losses (short stops) become fuel to push the price higher"]},script:{zh:"第五阶段，报复与错误反手。散户在止损后，看到价格突破，误以为趋势反转，于是追空，试图回本。但机构在拿到流动性后迅速反转。散户在最低点追空再次被套，他们的新止损又成了推动价格上涨的燃料。",en:"Stage 5: Revenge & Misread Reversal. After getting stopped out, retail sees the breakdown and assumes a trend reversal, shorting to make their money back. But institutions, having grabbed liquidity, rapidly reverse. Retail gets trapped shorting the low, and their new stop losses become fuel for the upward move."}},{id:"m11-s10",title:{zh:"Case Study 1: 亚盘诱导与伦/纽盘收割\\n(Asia Session Inducement & London/NY Sweep)",en:"Case Study 1: Asia Session Inducement & London/NY Sweep"},diagram:"m11-case1",bullets:{zh:["Stage 1 (Curiosity): 亚盘缓慢上涨，形成明显的支撑趋势线。","Stage 2 (Belief): 散户在趋势线做多，止损放在亚盘低点（Asia Low）下方。","Stage 3 (Stress): 伦敦盘开盘，价格开始下跌，逼近趋势线。","Stage 4 (Panic): 价格加速跌破趋势线和 Asia Low，扫掉多头止损。","Stage 5 (Revenge): 散户看到破位开始追空，纽约盘迅速反转向上，空头被套。"],en:["Stage 1 (Curiosity): Asia session slowly grinds up, forming a clear support trendline.","Stage 2 (Belief): Retail buys the trendline, placing stops below Asia Low.","Stage 3 (Stress): London open, price starts dropping, approaching the trendline.","Stage 4 (Panic): Price accelerates below the trendline and Asia Low, sweeping long stops.","Stage 5 (Revenge): Retail sees the breakdown and chases shorts. NY session rapidly reverses upwards, trapping shorts."]},script:{zh:"案例1：亚盘诱导与伦纽盘收割。亚盘缓慢上涨形成趋势线（Stage 1 & 2），散户做多。伦敦盘开盘下跌（Stage 3），随后加速跌破亚盘低点扫损（Stage 4）。散户追空，纽约盘迅速反转向上，空头被套（Stage 5）。这是一个经典的时间维度的情绪序列。",en:"Case Study 1: Asia Inducement & London/NY Sweep. Asia grinds up forming a trendline (Stages 1 & 2), retail buys. London opens and drops (Stage 3), then accelerates below Asia Low to sweep stops (Stage 4). Retail chases shorts, and NY rapidly reverses up, trapping them (Stage 5). A classic time-based emotional sequence."}},{id:"m11-s11",title:{zh:"Case Study 2: 假突破与 BPR 陷阱\\n(Fake Breakout & BPR Trap)",en:"Case Study 2: Fake Breakout & BPR Trap"},diagram:"m11-case2",bullets:{zh:["Stage 1 & 2: 价格在一个区间震荡，突然向上突破区间高点，散户追多。","Stage 3: 突破后没有延续，价格停滞。","Stage 4: 一根大阴线砸回区间内，多头止损被扫。","Stage 5: 散户认为突破失败，反手做空。但价格回踩刚才形成的大阴线（BPR）后，再次向上突破，空头爆仓。"],en:["Stage 1 & 2: Price ranges, then suddenly breaks above the range high. Retail chases longs.","Stage 3: No continuation after the breakout, price stalls.","Stage 4: A large bearish candle dumps back into the range, sweeping long stops.","Stage 5: Retail assumes failed breakout and flips short. But price retraces to the large bearish candle (BPR) and breaks out upwards again, liquidating shorts."]},script:{zh:"案例2：假突破与BPR陷阱。价格突破区间高点，散户追多（Stage 1 & 2）。突破停滞（Stage 3），随后大阴线砸回区间扫损（Stage 4）。散户反手做空，但价格回踩BPR后再次向上突破，空头爆仓（Stage 5）。",en:"Case Study 2: Fake Breakout & BPR Trap. Price breaks range high, retail chases longs (Stages 1 & 2). Breakout stalls (Stage 3), then a large bearish candle dumps back in, sweeping stops (Stage 4). Retail flips short, but price retraces to the BPR and breaks out upwards again, liquidating shorts (Stage 5)."}},{id:"m11-s12",title:{zh:"如何利用情绪序列交易？\\n从“受害者”变成“捕猎者”",en:'How to Trade the Emotional Sequence?\\nFrom "Victim" to "Predator"'},diagram:"m11-predator",bullets:{zh:["不要在 Stage 1 & 2 (形成期) 过早入场，那是给机构提供流动性。","耐心等待 Stage 4 (Panic) 的发生，即 Liquidity Sweep。","在 Stage 5 (Revenge) 机构反转时，寻找 LTF 的 MSS 和 FVG 进场。","你的入场点，应该是散户最绝望的止损点，或者是他们错误反手的起点。"],en:["Do not enter too early in Stages 1 & 2 (Formation); you are providing liquidity to institutions.","Patiently wait for Stage 4 (Panic) to occur, i.e., the Liquidity Sweep.","Enter during Stage 5 (Revenge) when institutions reverse, looking for LTF MSS and FVG.","Your entry point should be retail's most desperate stop-loss point, or the start of their misread reversal."]},script:{zh:"如何利用情绪序列？不要在形成期过早入场，那是给机构提供流动性。耐心等待恐慌阶段的流动性扫取。在机构反转时，寻找低时间级别的结构转变和FVG进场。你的入场点，应该是散户最绝望的止损点，或者是他们错误反手的起点。",en:"How to trade this? Don't enter early in Stages 1 & 2; you're just providing liquidity. Wait patiently for Stage 4 (Panic) and the liquidity sweep. Enter during Stage 5 when institutions reverse, looking for LTF MSS and FVG. Your entry point should be retail's most desperate stop-loss point, or where they wrongly flip their bias."}},{id:"m11-s13",title:{zh:"情绪序列与 Wyckoff 的结合\\n(Emotional Sequence & Wyckoff)",en:"Emotional Sequence & Wyckoff"},diagram:"m11-wyckoff",bullets:{zh:["Stage 1 & 2 (Curiosity & Belief) = Wyckoff 的 Phase A & B (建立交易区间，诱导方向)。","Stage 3 (Stress) = Phase C 的前奏。","Stage 4 (Panic) = Phase C 的 Spring / Upthrust (扫取流动性，终极恐慌)。","Stage 5 (Revenge) = Phase D & E (真正的趋势爆发，散户踏空或做反)。"],en:["Stage 1 & 2 (Curiosity & Belief) = Wyckoff Phase A & B (Establishing TR, inducing direction).","Stage 3 (Stress) = Prelude to Phase C.","Stage 4 (Panic) = Wyckoff Phase C Spring / Upthrust (Liquidity sweep, ultimate panic).","Stage 5 (Revenge) = Wyckoff Phase D & E (True trend breakout, retail misses out or trades against it)."]},script:{zh:"情绪序列与威科夫理论完美契合。阶段1和2对应威科夫的阶段A和B，建立区间并诱导方向。阶段3是阶段C的前奏。阶段4的恐慌就是阶段C的Spring或Upthrust，扫取流动性。阶段5的报复对应阶段D和E，真正的趋势爆发，散户踏空或做反。",en:"The emotional sequence aligns perfectly with Wyckoff. Stages 1 & 2 correspond to Wyckoff Phases A & B, establishing the range and inducing bias. Stage 3 is the prelude to Phase C. Stage 4 (Panic) is the Phase C Spring or Upthrust, sweeping liquidity. Stage 5 corresponds to Phases D & E, the true trend breakout where retail misses out or trades against it."}},{id:"m11-s14",title:{zh:"情绪序列与 SMC 的结合\\n(Emotional Sequence & SMC)",en:"Emotional Sequence & SMC"},diagram:"m11-smc",bullets:{zh:["Stage 1 & 2 = Inducement (诱导) / Engineering Liquidity (构建流动性)。","Stage 4 = Liquidity Sweep (扫取流动性) / Mitigation (缓解)。","Stage 5 = Market Structure Shift (MSS) / Displacement (破坏) / FVG 形成。","SMC 的核心，就是等待 Stage 4 完成，在 Stage 5 进场。"],en:["Stage 1 & 2 = Inducement / Engineering Liquidity.","Stage 4 = Liquidity Sweep / Mitigation.","Stage 5 = Market Structure Shift (MSS) / Displacement / FVG formation.","The core of SMC is waiting for Stage 4 to complete and entering during Stage 5."]},script:{zh:"情绪序列与SMC也是相通的。阶段1和2就是Inducement（诱导）或构建流动性。阶段4就是Liquidity Sweep（扫取流动性）。阶段5就是MSS、Displacement和FVG的形成。SMC的核心，就是等待阶段4完成，在阶段5进场。",en:"The emotional sequence also maps to SMC. Stages 1 & 2 are Inducement and Engineering Liquidity. Stage 4 is the Liquidity Sweep. Stage 5 is the Market Structure Shift, Displacement, and FVG formation. The core of SMC is waiting for Stage 4 to complete and entering during Stage 5."}},{id:"m11-s15",title:{zh:"实战检查清单 (Checklist)\\n在扣动扳机前，问自己这几个问题",en:"Practical Checklist\\nAsk yourself these questions before pulling the trigger"},diagram:"m11-checklist",bullets:{zh:["1. 现在的行情处于情绪序列的哪一个阶段？","2. 散户的止损池（Liquidity Pool）在哪里？","3. 市场是否已经完成了 Stage 4 (Panic / Sweep)？","4. 我现在的入场，是在给机构提供流动性，还是在跟随机构利用流动性？","5. 如果我在这里做多，谁在卖给我？（他们是被迫止损的空头吗？）"],en:["1. Which emotional stage is the current market in?","2. Where is the retail Liquidity Pool?","3. Has the market completed Stage 4 (Panic / Sweep)?","4. Is my entry providing liquidity to institutions, or following them in exploiting it?","5. If I go long here, who is selling to me? (Are they forced short stop-outs?)"]},script:{zh:"实战检查清单：在扣动扳机前，问自己：现在处于哪个情绪阶段？散户的止损池在哪里？市场是否已经完成了扫取？我现在的入场，是在给机构提供流动性，还是在跟随机构？如果我做多，谁在卖给我？",en:"Practical Checklist: Before pulling the trigger, ask yourself: Which emotional stage are we in? Where is the retail liquidity pool? Has Stage 4 (Sweep) completed? Is my entry providing liquidity, or following institutions? If I go long, who is selling to me?"}},{id:"m11-s16",title:{zh:"总结：高级交易者的视角\\n(Summary: The Advanced Trader's Perspective)",en:"Summary: The Advanced Trader's Perspective"},diagram:"m11-summary",bullets:{zh:["不要只看 K 线的红绿，要看 K 线背后的人性。","流动性是市场的燃料，而情绪是制造燃料的机器。","理解了情绪序列，你就能提前预判流动性扫取的位置。","做交易，就是做“少数派”：在别人贪婪时等待，在别人恐慌时进场，在别人报复时获利。"],en:["Don't just look at red and green candles; look at the human nature behind them.","Liquidity is the market's fuel, and emotion is the machine that creates it.","Understanding the emotional sequence allows you to anticipate liquidity sweeps.",'Trading is about being the "minority": wait when others are greedy, enter when others panic, profit when others seek revenge.']},script:{zh:"总结一下，高级交易者不只看K线，更看背后的人性。流动性是燃料，情绪是制造燃料的机器。理解了情绪序列，你就能提前预判流动性扫取的位置。做交易，就是做少数派：在别人贪婪时等待，在别人恐慌时进场，在别人报复时获利。",en:"To summarize, advanced traders look beyond candles to the human nature behind them. Liquidity is fuel, emotion creates it. Understanding this sequence lets you anticipate sweeps. Trading is being the minority: wait during greed, enter during panic, profit during revenge."}}]}];function N5(e){var t,n,r="";if(typeof e=="string"||typeof e=="number")r+=e;else if(typeof e=="object")if(Array.isArray(e)){var l=e.length;for(t=0;t<l;t++)e[t]&&(n=N5(e[t]))&&(r&&(r+=" "),r+=n)}else for(n in e)e[n]&&(r&&(r+=" "),r+=n);return r}function Ye(){for(var e,t,n=0,r="",l=arguments.length;n<l;n++)(e=arguments[n])&&(t=N5(e))&&(r&&(r+=" "),r+=t);return r}var C6=["dangerouslySetInnerHTML","onCopy","onCopy
