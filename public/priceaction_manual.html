en:"Unit 1 Trade Like a Pro Trader"},identify:{zh:"识别",en:"IDENTIFY"},plan:{zh:"计划",en:"PLAN"},patience:{zh:"耐心",en:"PATIENCE"},execute:{zh:"执行",en:"EXECUTE"},planningWord:{zh:"计划",en:"PLANNING"},waitForBreakout:{zh:"等待突破",en:"Wait for breakout"},target:{zh:"目标",en:"TARGET"},waitDots:{zh:"等待...",en:"wait..."},nowEnter:{zh:"此处入场",en:"Now Enter"},candleReview:{zh:"蜡烛图复盘",en:"CANDLE REVIEW"},candleAnatomy:{zh:"蜡烛图解剖",en:"CANDLE ANATOMY"},candleWicks:{zh:"蜡烛影线",en:"CANDLE WICKS"},noWick:{zh:"无上影/下影",en:"No Top/Bottom Wick"},marketStructure:{zh:"市场结构",en:"MARKET STRUCTURE"},bullishTrend:{zh:"多头趋势",en:"BULLISH TREND"},bearishTrend:{zh:"空头趋势",en:"BEARISH TREND"},ranges:{zh:"区间",en:"RANGES"},changeStructure:{zh:"结构切换",en:"CHANGE OF STRUCTURE"},tradeSetups:{zh:"交易设置",en:"TRADE SETUPS"},advancedConcepts:{zh:"高级概念",en:"ADVANCED CONCEPTS"},xauExample:{zh:"XAUUSD 市场示例",en:"XAUUSD Market Example"},unit3Title:{zh:"Unit 3 市场阶段",en:"Unit 3 Market Cycles"},marketCycles:{zh:"市场阶段",en:"MARKET CYCLES"},ltfVsHtf:{zh:"LTF VS HTF",en:"LTF VS HTF"},huntingOpportunities:{zh:"寻找机会",en:"HUNTING OPPORTUNITIES"},whenToBePatient:{zh:"何时保持耐心",en:"WHEN TO BE PATIENT"},setupsToLookFor:{zh:"寻找的交易设置",en:"setups to look for"},breakoutsFakeouts:{zh:"突破 / 假突破",en:"breakouts / fakeouts"},htfDrive:{zh:"HTF 价格迁移",en:"HTF DRIVE"},htfRange:{zh:"HTF 区间运动",en:"HTF RANGE"},htfFakeout:{zh:"HTF 假突破",en:"HTF FAKEOUT"}},Ve={overviewDesc:{zh:"在 HTF 和 LTF 上都能看到相同的市场阶段。为了更好地理解价格意图，我们需要结合两者，例如：识别 HTF 的价格迁移配合 LTF 的流动性抓取，并针对具体情况采取正确的入场。",en:"The same market cycles can be seen on both the HTF and LTF. To get a better understanding of what price wants to do, we need to use the combination of both, i.e., being able to identify a HTF drive with a LTF liquidity grab and taking the right entry for each specific situation."},driveTitle:{zh:"价格迁移",en:"DRIVE"},drivePoints:[{zh:"清晰的市场方向",en:"Clear market direction"},{zh:"干净的推动与区间回补",en:"Clean pushes and range fill"},{zh:"可预测的价格行为",en:"Predictable price action"}],driveHunting:{zh:"当价格处于迁移阶段时，会有更多的寻找机会。价格很可能已经找到了方向，顺势而为通常是最佳选择。需要注意的是，不要轻易被反向交易诱导。如果价格已经选定了当天的方向，最好不要试图当“英雄”。",en:"When price is driving, there are more hunting opportunities. Price has likely found its direction and jumping on the trend usually is the way to go. A word of caution is to not get easily persuaded into trades in the opposite direction. If price has chosen its direction for the day, it is usually best to not be the 'hero'."},drivePatient:{zh:"价格通常处于迁移中，因为 HTF 已经抓取了流动性并正在其 HTF 区间内运行。因为我们始终处于 HTF 区间内，我们需要警惕的是 HTF 何时已经完成了区间回补。一旦发生，价格的可预测性就会大大降低。因此，我们通常以 HTF 区间回补为目标，一旦完成，我们就开始变得更加耐心。",en:"Price usually is driving because the HTF has grabbed liquidity and is driving in its HTF range. Because we are always in a HTF range, what we have to be careful of is when the HTF has already filled the range. Once that has happened, it makes price much less predictable. Because of this, we usually target the HTF range fills, and once that has happened, we start being more patient."},driveChartDesc:{zh:"在此阶段，价格波动通常很清晰。价格通常会持续创造（在本例中）更低低点和更低高点。",en:"Price movement during this phase is often clear. Price typically continues to make (in this example) lower lows and lower highs."},driveHtfDesc:{zh:"在 HTF 上，我们可能只看到强劲的看跌蜡烛和影线回补，但在 LTF 上，我们会看到价格下跌时形成的结构。这里唯一的担忧是价格是否有足够的流动性继续推动。",en:"On the HTF, we may just see strong bearish candles and wickfills, but on the LTF we will see structure being formed as price is coming down. The only worry here is whether or not price has enough liquidity to continue pushing."},rangeTitle:{zh:"区间运动",en:"RANGE"},rangePoints:[{zh:"方向不明",en:"Uncertain direction"},{zh:"预期流动性",en:"Expecting liquidity"},{zh:"交易区间",en:"Trade the range"}],rangeHunting:{zh:"当市场处于区间运动时，通常更难找到干净的头寸。价格需要显示方向，但在区间内时，我们无法确认价格是否会留在区间内，也无法确认突破是否真实。留意所有类型的头寸（假突破、夹心和突破），并等待适当的流动性抓取后再跟随价格的方向和延续。",en:"When the market is ranging, it is typically more difficult to find clean positions. Price needs to show direction but when its ranging, we have no confirmation that price will stay in the range, nor do we have confirmation that a breakout is truly a breakout. Watch out for all types of positions (fakeouts, onions and breakouts) and wait for a proper liquidity grab before following price's direction and continuation."},rangePatient:{zh:"因为价格处于区间内，缺乏方向，这通常意味着我们需要保持耐心，等待方向形成。通常还需要成交量激增来突破区间，所以我们可以寻找流动性抓取。此外，要小心在假突破后立即开仓。假突破可能会演变成延续和市场结构切换。",en:"Because price is in a range, there is a lack of direction, and a lack of direction usually will mean we have to be patient and wait for direction to form. Usually a spike in volume is also required to break out of the range, so a liquidity grab is what we can look for. Additionally, be careful of taking positions immediately after the fakeout. A fakeout could turn into a continuation and market structure shift."},rangeChartDesc:{zh:"价格最终会找到一个盘整的地方。这可能是因为三大交易时段之外缺乏成交量，但通常是价格需要更多流动性来继续推动的信号。",en:"Price will eventually find a place to consolidate. This can be because there is a lack of volume outside of the 3 main sessions, but usually is a sign that price requires more liquidity to continue its push."},rangeHtfDesc:{zh:"根据区间持续的时间，价格在 HTF 上可能看起来仍在推进，但在 LTF 上，可以建立一个区间。",en:"Depending on how long it ranges for, price may look like it is still pushing through on the HTF, but on the LTF, a range can be established."},liquidityTitle:{zh:"流动性",en:"LIQUIDITY"},liquidityPoints:[{zh:"价格操纵",en:"Price manipulation"},{zh:"选择方向",en:"Choosing direction"},{zh:"对价格行为做出反应",en:"React to price action"}],liquidityHunting:{zh:"流动性分为两个阶段。对于流动性抓取本身，当价格在跟随 HTF 方向时收回到区间内，可能会发现寻找机会。为了进一步确认，请等待流动性抓取后的再次突破，通常这种头寸会有更高的胜率。总的来说，流动性的市场阶段是寻找头寸的好时机。",en:"Liquidity comes in two phases. For the Liquidity grab itself, hunting opportunities may be found when price closes back into the range when it follow the direction of the HTF. For further confirmation, wait until the re-breakout following the liquidity grab, and usually this position will have a higher win-rate. Overall, the market cycle of liquidity is a good time to hunt for positions."},liquidityPatient:{zh:"如果价格在流动性抓取后没有很快开始迁移，这可能意味着价格更加不确定。它可能正在寻找相反方向的流动性以进行市场结构切换，或者只是延迟的价格行为。无论哪种方式，这时我们都应该行使耐心，等待进一步的确认，如突破收盘。",en:"In the case that price doesn't start driving soon after the liquidity grab, it could mean that price is more uncertain. It could be looking for liquidity in the opposite direction for a market structure shift, or it could just be delayed price action. Either way, this is when we should exercise patience and wait for further confirmations such as breakout closures."},liquidityFakeoutTitle:{zh:"流动性 - 假突破",en:"LIQUIDITY - FAKEOUT"},liquidityFakeoutDesc:{zh:"当我们谈论流动性时，通常我们是在寻找价格达到过去曾触及的某个价格点。",en:"When we talk about liquidity, often we are looking for price to reach a certain price point that it has tapped in the past."},liquidityContinuationTitle:{zh:"流动性 - 延续",en:"LIQUIDITY - CONTINUATION"},liquidityContinuationDesc:{zh:"抓取流动性后，价格可以做出决定。要么流动性抓取是市场结构切换的开始，要么是价格继续下跌的流动性。通过等待突破收盘形式的进一步确认，我们可以入场，因为知道价格更有可能进一步下跌。",en:"After grabbing liquidity, price can make a decision. Either the liquidity grab is the start of a market structure shift, or it is liquidity for price to continue pushing down. By waiting for a further confirmation in the form of a breakout closure, we can enter knowing that price is more likely to drive further down."},liquidityHtfDesc:{zh:"这一点通常通过之前的价格行为找到，并镜像我们可以通过查看价格行为历史看到的走势。",en:"This point is typically found through previous price action and mirrors we can see by looking at price action history."}},de={unit4Title:{zh:"Unit 4 执行",en:"Unit 4 Execution"},timeframesTitle:{zh:"理解时间周期",en:"UNDERSTANDING TIMEFRAMES"},readingTfTitle:{zh:"读取每个时间周期",en:"READING EACH TIMEFRAME"},readingTfDesc:{zh:"循环查看从 HTF（月线 -> 4H）到 LTF（1H - 15/5M）的每个时间周期，并尝试理解价格当前正在做什么。HTF 会告诉你价格在遥远的未来可能会去哪里，而 LTF 会告诉你价格在达到这些 HTF 目标之前短期内可能需要发生什么。",en:"Cycle through each timeframe from the HTF (Monthly -> 4H) to the LTF (1H - 15/5M) and try to understand what price is currently doing. The HTF will tell you where price will likely go in the far future, and the LTF will tell you what may need to happen in the short term before price is able to reach those HTF goals."},keyActivity:{zh:"这里的关键活动是识别 HTF 和 LTF 当前处于市场的哪个周期。我们需要识别价格是否拥有所需的流动性，以便继续其先前的轨迹。",en:"They key activity here is to identify what cycle of the market both the HTF and LTF is currently in. We need to identify whether or not price has the liquidity it needs, in order to continue in its previous trajectory"},tfClarityTitle:{zh:"时间周期的清晰度",en:"TIMEFRAME CLARITY"},tfClarityDesc:{zh:"并非每个时间周期的方向都是清晰的。偶尔会有某些时间周期的区间重叠或难以读取。这是非常正常的，因为对于先前不清晰的价格行为我们无能为力，我们唯一能做的就是寻找对我们来说最有意义的时间周期。",en:"Not every time frame will be clear in terms of direction. Occasionally there will be certain time frames which have ranges which overlap or are hard to read. This is very normal and because there is not much we can do about previous price action being unclear, all we can do is look for the timeframes that make the most sense to us"},tfOfInterestTitle:{zh:"感兴趣的时间周期",en:"TIMEFRAMES OF INTEREST"},tfOfInterestDesc:{zh:"当我们能够选择 3 或 4 个清晰且在水平方面互补的时间周期时，我们可以决定将这些时间周期用于我们的交易想法。",en:"When we are able to choose the 3 or 4 timeframes which are clear and complement each other in terms of levels, we can decide to use these timeframes for our trade idea"},tfAlignmentExample:{zh:`时间周期对齐的一个例子如下：
Daily - 多头突破上方
4H - 多头突破上方
30M - 空头假突破
这些时间周期都对齐以买入，但各自处于不同的周期。`,en:`An example of timeframe alignment would be the following:
Daily - Bullish Breakout above
4H - Bullish Breakout above
30M - Bearish fakeout
These timeframes all align for buys but are at different cycles individually`},executionStrategy:{zh:"执行与策略",en:"Execution & Strategy"},exampleAlignmentTitle:{zh:"对齐示例",en:"Example Alignment"},alignmentDaily:{zh:"日线",en:"Daily"},alignment4H:{zh:"4H",en:"4H"},alignment30M:{zh:"30M",en:"30M"},bullishBreakoutAbove:{zh:"上方多头突破",en:"Bullish Breakout above"},bearishFakeout:{zh:"空头假突破",en:"Bearish fakeout"},keyLevelsTitle:{zh:"制作关键水平",en:"MAKING KEY LEVELS"},whatLevelsTitle:{zh:"使用哪些水平",en:"WHAT LEVELS TO USE"},whatLevelsDesc:{zh:"你看图表的时间越长，你开始发现的水平就越多。如果你花太长时间寻找水平，你得出的水平可能太具体且视野太狭隘。尝试在 HTF 上标出 3 或 4 个主要水平，在 LTF 上标出 1 或 2 个次要水平。",en:"The longer you look at the charts, the more levels you will start to find. If you end up spending too long looking for levels, the levels you come up with are probably too specific and too tunnel visioned. Try to mark out 3 or 4 major levels on your HTF and on your LFT, maybe mark out 1 or 2 minor levels"},majorLevelsTitle:{zh:"主要水平",en:"MAJOR LEVELS"},majorLevelsDesc:{zh:"主要水平通常非常明显。它由在过去价格行为历史中被多次回测的支撑和阻力组成。这些水平通常也被 HTF 和 LTF 市场结构所尊重。",en:"A major level is a level that is usually quite obvious. It is made up of supports and resistances that have been retested many times in past price action history. These levels typically are also respected by both HTF and LTF market structure"},minorLevelsTitle:{zh:"次要水平",en:"MINOR LEVELS"},minorLevelsDesc:{zh:"次要水平通常也比较明显。它由支撑和阻力组成，在过去的价格行为历史中被多次回测。这些水平通常也受到 HTF 和 LTF 市场结构的尊重。",en:"A minor level is a level that is usually quite obvious. It is made up of supports and resistances that have been retested many times in past price action history. These levels typically are also respected by both HTF and LTF market structure"},unclearLevelsTitle:{zh:"不清晰的水平",en:"UNCLEAR LEVELS"},unclearLevelsDesc:{zh:"当一个水平看起来难以读取，并且你发现自己在怀疑它是否真的是一个横跨的水平时，它可能是一个不清晰的水平。如果你发现自己拼命尝试寻找与水平完全匹配的确切点，并且花了很长时间才找到，请尝试使用其他更清晰明显的水平代替。",en:"When a level looks difficult to read and you find yourself wondering if it actually is a level that goes across, it is probably an unclear level. If you find yourself trying desparately to find the exact points that match the level and it takes you quite a while to find, try using alternate levels intead which are clearer and obvious"},tradingPlanTitle:{zh:"寻找交易机会",en:"TRADING PLAN"},tradingPlanDesc:{zh:"一旦你有了水平，你就可以开始为价格制定计划。在这种情况下，让我们假设价格过去一直在向上推进，并已开始盘整。",en:"Once you have your levels, you can start creating a plan for price. In this case, lets assume that price has been pushing upwards in the past, and has started ranging"},examplePlanTitle:{zh:"交易计划示例",en:"EXAMPLE TRADING PLAN"},examplePlanPoints:[{zh:"1. 等待流动性抓取",en:"1. Wait for Liquidity grab"},{zh:"2. 等待突破收盘确认",en:"2. Wait for a breakout closure confirmation"},{zh:"3. 如果突破蜡烛有体面的上影线，则入场突破，否则等待进一步确认",en:"3. If the breakout candle has a decent top wick, take the breakout, if not, wait for further confirmation"}],breakoutContTitle:{zh:"突破延续",en:"BREAKOUT CONTINUATION"},breakoutContDesc:{zh:"抓取流动性后，我们希望寻找突破收盘以确认我们的方向。然而，这根突破蜡烛的上影线非常小，这意味着我们可能需要进一步的确认。",en:"After Liquidity is grabbed, we want to look for the breakout closure to confirm our direction. However, this breakout candle has very little top wick, which means that we may need further confirmations"},range2BreakTitle:{zh:"区间 2 突破",en:"RANGE 2 BREAKOUT"},range2BreakDesc:{zh:"价格建立区间 2 后，现在更有把握继续向上推进。这是在流动性抓取和区间 2 突破收盘确认之后。",en:"After price establishes a range 2, price is now more confirmed to continue pushing upwards. This is following a liquidity grab, and range 2 breakout closure confirmation"},breakoutTitle:{zh:"突破",en:"BREAKOUT"},breakoutDesc:{zh:"计划的第一部分是看价格是否想要抓取流动性。现在我们看到流动性已被抓取，我们可以按照计划进入第 2 步：等待突破延续。",en:"The first part of the plan is to see if price wants to grab liquidity. Now that we see Liqiudity has been grabbed, we can follow our plan to step 2: waiting for a breakout continuation"},patienceTitle:{zh:"耐心等待和执行",en:"PATIENCE AND EXECUTION"},baseRangeTitle:{zh:"基础区间",en:"BASE RANGE"},trueBreakoutTitle:{zh:"真突破",en:"TRUE BREAKOUT"},liquidityGrabTitle:{zh:"流动性抓取",en:"LIQUIDITY GRAB"},anythingCanHappenDesc:{zh:"作为交易者，我们必须明白我们无法控制市场和价格想做什么，我们无法确定价格会向上还是向下迁移。然而，我们可以做的是分析价格行为，以更好地了解价格可能去哪里。",en:"As traders we must understand that we have no control over what the market and price wants to do and we cannot say for certain that price will be driving up or down. However, what we can do is analyze price action to get a better understanding of where price might go"},possibilityATitle:{zh:"可能性 (A)",en:"POSSIBILITY (A)"},possibilityADesc:{zh:"价格的一个潜在情景可能是它继续向上推进。在这种情况下，我们预期价格在上涨过程中会继续创造更高的高点和更高的低点。",en:"A potential scenario of price could be that it continues to push up. What we would expect in this case is for price to continue making higher highs and higher lows on its way up"},possibilityBTitle:{zh:"可能性 (B)",en:"POSSIBILITY (B)"},possibilityBDesc:{zh:"然而，即使价格有足够的流动性，价格也同样可能发生假突破并回到区间内。通过查看 HTF，我们通常可以阻止自己进入对我们不利的反转头寸。",en:"However, price is equally likely to fakeout and come back into the range even if price has enough liquidity. By looking at the HTF, we can often stop ourselves from getting into positions that reverse on us"},crucialPatience:{zh:"这就是为什么保持耐心并适应价格行为至关重要。在任何给定时刻，价格都可以随心所欲。永远不要试图强迫行动进入我们的计划，因为这会降低你的胜率。",en:"This is why it is crucial to be patient and adapt to price action. At any given moment, price can do whatever it wants. Never try to force action into our plan as this will reduce your winrate"},trafficAdvantageTitle:{zh:"数据相似性",en:"DATA SIMILARITY"},historicalPriceTitle:{zh:"历史价格数据",en:"Historical Price Data"},currentPriceTitle:{zh:"当前价格数据",en:"Current Price Data"},historicLiquidityTitle:{zh:"1. 历史流动性",en:"1. HISTORIC LIQUIDITY"},historicLiquidityDesc:{zh:"无需猜测价格想在哪里抓取流动性。价格的好处在于它会重复其模式。如果我们能够识别价格当前处于哪个区域，并识别在那段时间内它在哪里抓取了流动性，我们就能更好地预测价格这次可能在哪里抓取流动性。",en:"There is no need to guess where price wants to grab its liquidity. The good thing about price is that it repeats its patterns. If we are able to identify which area price is currently in and identify where it grabbed liquidity during that period of time, we can better predict where price might grab liquidity this time"},historicBreakoutTitle:{zh:"2. 历史突破",en:"2. HISTORICAL BREAKOUT"},historicBreakoutDesc:{zh:"价格抓取流动性后，它突破了区间。这给了我们更好的价格方向指示，特别是由于价格之前已经抓取过流动性。",en:"After price grabs liquidity, it breaks out of the range. This gives us a better indication of price's direction, especially because price has grabbed liquidity previously"},historicRangeFillTitle:{zh:"3. 历史区间回补",en:"3. HISTORICAL RANGE FILL"},historicRangeFillDesc:{zh:"随着突破，我们可以看到价格已经回补了上方的下一个区间。因此，我们可以将此水平作为我们的交易目标。",en:"Following the breakout we can see that price has filled the next range up. Because of this, we can use this level as our trade target"},currentStruggleTitle:{zh:"4. 当前挣扎",en:"4. CURRENT STRUGGLE"},currentStruggleDesc:{zh:"从目前的价格行为来看，我们可以看到它一直在努力向上推进，尽管方向和动量是看涨的。价格不推进的主要原因之一是缺乏流动性——那么我们在哪里可以找到所需的流动性呢？",en:"With price action currently, we can see that it has been struggling to push up even though the direction and momentum is bullish. One of the main reasons price is not pushing is due to the lack of liquidity - so where can we find the liquidity required?"},currentLiquidityTitle:{zh:"5. 当前流动性",en:"5. CURRENT LIQUIDITY"},currentLiquidityDesc:{zh:`因为我们预期价格会在与之前抓取流动性相似的价格点抓取流动性，我们可以通过两种方式利用这一点：
1. 既然我们预期会有流动性，我们可以建立头寸以达到这一点。
2. 抓取流动性后，我们对价格可能去哪里有了更好的了解，并可以寻找流动性抓取后的头寸。`,en:`Because we are expecting price to grab liquidity at a similar price point as where price previously grabbed liquidity, we can use this point to our advantage in two ways:
1. Since we are expecting liquidity, we could take positions to get to this point
2. After grabbing liquidity, we have a better idea of where price may go and can look for positions following the liquidity grab`},imperfectPriceTitle:{zh:"6. 不完美的价格",en:"6. IMPERFECT PRICE"},imperfectPriceDesc:{zh:"价格永远不会完美，因此，我们不能指望价格总是精确地触及我们的水平。这取决于我们是否决定在流动性抓取后进入头寸——完美的或不完美的。",en:"Price is never perfect, and because of this, we can't expect price to always tap into our level exactly. It is up to us if we decide to take positions after the liquidity grab - perfect or imperfect"}},Wte={breakout:{zh:"突破",en:"BREAKOUT"},fakeout:{zh:"假突破",en:"FAKEOUT"},onion:{zh:"夹心",en:"ONION"}},io={drive:{zh:"价格迁移",en:"DRIVE"},range:{zh:"区间运动",en:"RANGE"},liquidity:{zh:"流动性",en:"LIQUIDITY"}},i4=[{title:{zh:"日内分析",en:"Daily Analysis"},desc:{zh:"从 HTF 到 LTF 做完整开盘分析。",en:"Start your day with a full HTF-to-LTF analysis."}},{title:{zh:"高时间框架（HTF）",en:"Higher Time Frame (HTF)"},desc:{zh:"识别 HTF 当前所处周期。",en:"Identify the current HTF cycle."}},{title:{zh:"低时间框架（LTF）",en:"Lower Time Frame (LTF)"},desc:{zh:"识别 LTF 当前所处周期。",en:"Identify the current LTF cycle."}},{title:{zh:"观察重点",en:"What To Look For"},desc:{zh:"明确当下优先关注的交易线索。",en:"Define the main trade idea to track."}},{title:{zh:"Setup 类型",en:"Setups Type"},desc:{zh:"决定入场模型。",en:"Choose your entry model."}},{title:{zh:"重点风险",en:"What To Be Careful Of"},desc:{zh:"避免常见误判。",en:"Avoid common execution mistakes."}}],a4=[{htf:"drive",ltf:"drive",lookFor:{zh:"价格延续",en:"PRICE CONTINUATION"},careful:{zh:"关注更小周期流动性",en:"SMALLER TIMEFRAME LIQUIDITY"},setups:{breakout:!0,fakeout:!1,onion:!1}},{htf:"drive",ltf:"range",lookFor:{zh:"LTF 流动性",en:"LTF LIQUIDITY"},careful:{zh:"避免把流动性误判为反转",en:"MISTAKING LIQUIDITY AS REVERSAL"},setups:{breakout:!0,fakeout:!0,onion:!0}},{htf:"drive",ltf:"liquidity",lookFor:{zh:"延续",en:"CONTINUATION"},careful:{zh:"避免过早进入结构转换",en:"ENTERING TOO SOON INTO A CHANGE OF STRUCTURE"},setups:{breakout:!0,fakeout:!0,onion:!1}},{htf:"range",ltf:"drive",lookFor:{zh:"R2BO 后延续",en:"CONTINUATION AFTER R2BO"},careful:{zh:"先等 R2BO，首破可能是假突破",en:"WAIT FOR R2BO, FIRST BREAKOUT COULD BE A FAKEOUT"},setups:{breakout:!0,fakeout:!1,onion:!1}},{htf:"range",ltf:"range",lookFor:{zh:"先流动性后方向",en:"LIQUIDITY THEN DIRECTION"},careful:{zh:"避免把流动性抓取当作全天方向",en:"MISTAKING THE LIQUIDITY GRAB AS DIRECTION FOR THE DAY"},setups:{breakout:!1,fakeout:!1,onion:!1}},{htf:"range",ltf:"liquidity",lookFor:{zh:"假突破后回补区间并上探 HTF 位",en:"RANGE FILL AFTER FAKEOUT AND UP TO HTF LVL"},careful:{zh:"等待流动性与回收区间，牢记 HTF 方向",en:"WAIT FOR LIQUIDITY AND CLOSURE BACK INTO RANGE, REMEMBER HTF DIRECTION"},setups:{breakout:!0,fakeout:!0,onion:!1}},{htf:"liquidity",ltf:"drive",lookFor:{zh:"收回区间内，假突破后完成区间回补",en:"CLOSURE BACK INTO RANGE, FAKEOUTS INTO RANGE FILL"},careful:{zh:"避免把流动性误判为方向",en:"MISTAKING LIQUIDITY AS DIRECTION"},setups:{breakout:!0,fakeout:!0,onion:!1}},{htf:"liquidity",ltf:"range",lookFor:{zh:"延续或 LTF 流动性",en:"CONTINUATION OR LTF LIQUIDITY"},careful:{zh:"警惕 LTF 流动性，优先 R2BO 或 LTF 假突破",en:"WATCH OUT FOR LTF LIQUIDITY, TAKE R2BO OR LTF FAKEOUTS"},setups:{breakout:!0,fakeout:!0,onion:!1}},{htf:"liquidity",ltf:"liquidity",lookFor:{zh:"等待真实方向",en:"WAIT FOR ACTUAL DIRECTION"},careful:{zh:"等待 R2BO 确认方向，可能出现双假突破",en:"WAIT FOR R2BO TO CONFIRM DIRECTION, SOMETIMES DOUBLE FAKEOUTS HAPPEN"},setups:{breakout:!0,fakeout:!1,onion:!1}}],Xte=[{unit:"Unit 0",title:be.unit0,href:"#unit0"},{unit:"Unit 1",title:be.unit1,href:"#unit1"},{unit:"Unit 2",title:be.unit2,href:"#unit2"},{unit:"Unit 3",title:be.unit3,href:"#unit3"},{unit:"Unit 4",title:be.unit4,href:"#unit4"}],Zte=[{title:{zh:"1. 蜡烛图复盘",en:"1. Candle Review"},href:"#unit2-candle-review"},{title:{zh:"2. 市场结构",en:"2. Market Structure"},href:"#unit2-market-structure"},{title:{zh:"3. 交易设置",en:"3. Trade Setups"},href:"#unit2-trade-setups"},{title:{zh:"4. 高级概念",en:"4. Advanced Concepts"},href:"#unit2-advanced-concepts"},{title:{zh:"5. 流动性",en:"5. Liquidity"},href:"#unit2-liquidity"}],Qte=[{title:{zh:"1. 市场阶段",en:"1. Market Cycles"},href:"#unit3-market-cycles"},{title:{zh:"2. 价格迁移 (Drive)",en:"2. Drive"},href:"#unit3-drive"},{title:{zh:"3. 区间运动 (Range)",en:"3. Range"},href:"#unit3-range"},{title:{zh:"4. 流动性 (Liquidity)",en:"4. Liquidity"},href:"#unit3-liquidity"}],la={identifyA:{zh:"在高时间框架（HTF）与低时间框架（LTF）中识别当前市场周期。不同周期需要不同的交易计划。",en:"Understand the current market cycle in both high-time frame (HTF) and low-time frame (LTF) charts. Each market cycle requires a unique trading plan."},identifyB:{zh:"结合 HTF 与 LTF K 线，建立完整的价格叙事。通过历史重复行为，推演接下来可能发生的价格路径。",en:"Utilize both HTF and LTF candlesticks to construct a comprehensive price narrative. Use repeatable historical behavior to project near-future moves."},planA:{zh:"基于价格行为呈现出来的叙事制定计划。像一个完整故事一样，逻辑必须连贯，不要让计划硬套过去的走势。",en:"Develop your plan based on the narrative that price action presents. Like a story, your analysis should be logical and interconnected. Avoid forcing your plan to fit old moves."},planB:{zh:"让计划保持简单: 识别 X，当 X 出现时执行 Y。计划越简单，复盘和追踪成功率越稳定。",en:"Keep your plan simple: identify 'X', and when 'X' occurs, execute 'Y'. The simpler your plan, the easier it is to track performance."},patienceA:{zh:"在等待计划与市场行为对齐时保持耐心。价格有自己的节奏，并非每天都提供交易机会。",en:"Exercise patience while waiting for your plan to align with market movement. Price action follows its own path, and some days do not offer opportunities."},patienceB:{zh:"保持冷静，市场明天还在。",en:"Stay calm, the market will still be there tomorrow."},executeA:{zh:"当价格进入目标区域并与策略条件一致时，精准执行计划。",en:"Execute your plan with precision when price enters target zones and aligns with your strategy."},executeB:{zh:"无论盈亏，计划都必须按规则执行。持续记录结果，才能评估模型有效性与长期胜率。",en:"Win or lose, a plan is a plan. Track both outcomes over time to evaluate setup effectiveness and long-term win rate."}},Tt={anatomyClosingTitle:{zh:"收盘价",en:"CLOSING PRICE"},anatomyClosingDesc:{zh:"蜡烛最终收盘的位置",en:"Price point where the candle closes"},anatomyOpeningTitle:{zh:"开盘价",en:"OPENING PRICE"},anatomyOpeningDesc:{zh:"蜡烛开启的位置，也是下一根蜡烛开盘的位置",en:"Price point where the candle opens, also where the next candle will open"},anatomyHighTitle:{zh:"上影线高点",en:"CANDLE WICK HIGH"},anatomyHighDesc:{zh:"价格触及的最高位置",en:"Highest point price reached"},anatomyBodyTitle:{zh:"蜡烛实体",en:"CANDLE BODY"},anatomyBodyDesc:{zh:"反映该根蜡烛大部分时间停留区域",en:"Reflects where price stayed for most of the candle"},anatomyLowTitle:{zh:"下影线低点",en:"CANDLE WICK LOW"},anatomyLowDesc:{zh:"价格触及的最低位置",en:"Lowest point price reached"},bullishNote:{zh:"适用于看涨蜡烛",en:"For bullish candles"},bearishNote:{zh:"看跌蜡烛逻辑相反",en:"The opposite applies for bearish candles"},wickRangeTitle:{zh:"影线区间",en:"WICK RANGES"},wickRangeDesc:{zh:"影线也是区间，只是发生在更小时间框架。影线告诉我们价格是否在延续时创造结构。",en:"Wicks are also ranges, but on smaller time frames. They help us see whether price is creating structure while continuing."},openingWickTitle:{zh:"开盘影线",en:"OPENING WICK"},openingWickDesc:{zh:"下一根蜡烛开盘通常会回补前一根的一部分影线，然后再延续原方向。",en:"The opening of the next candle often retraces part of the previous candle before continuing in its direction."},structureNote:{zh:"结构 = 价格持续抬高高点或抬升低点，从而形成可延续路径。",en:"Structure means price can form highs and lows that support continued drive."},noWickLead:{zh:"不带影线的蜡烛提供的信息更少，下一根是否回补更不确定。",en:"Candles with no wicks give less information and create uncertainty for the next move."},noWickBody:{zh:"这种情况下，价格可能直接延续，也可能先回撤抓取流动性。避免主观猜测。",en:"In this case, price can continue directly or retrace for liquidity first. Avoid guessing."},signsTitle:{zh:"回撤信号",en:"SIGNS OF RETRACEMENT"},signsDesc:{zh:"常见表现是先反转或回撤拿流动性，再回到原方向，但也可能直接穿越。",en:"Price often retraces to grab liquidity before continuing, but it can also drive straight through."}},Ke={breakoutContinuationsTitle:{zh:"突破与延续",en:"BREAKOUTS & CONTINUATIONS"},breakoutContinuationsDesc:{zh:"区间仍会形成，但价格更容易向上突破并继续迁移至下一个阻力位。",en:"Ranges still form, but price tends to break above and continue toward the next resistance."},higherHighsTitle:{zh:"更高高点",en:"HIGHER HIGHS"},higherHighsDesc:{zh:"多头趋势中，价格会持续抬高高点，通常直到触及 HTF 阻力。",en:"In a bullish trend, price continues to print higher highs until it reaches HTF resistance."},higherLowsTitle:{zh:"更高低点",en:"HIGHER LOWS"},higherLowsDesc:{zh:"在抬高高点的同时，结构也会抬高低点。",en:"Alongside higher highs, price also creates higher lows."},bullishLiquidityDesc:{zh:"抓流动性时，价格可能短暂跌破前低，再重新突破最新高点。",en:"During liquidity grabs, price can break a prior low before rebreaking the latest high."},liquidityExample:{zh:"流动性示例",en:"Liquidity Example"},lowerHighsTitle:{zh:"更低高点",en:"LOWER HIGHS"},lowerHighsDesc:{zh:"空头延续下，市场结构会不断形成更低高点。",en:"As price drives lower, market structure creates lower highs."},lowerLowsTitle:{zh:"更低低点",en:"LOWER LOWS"},lowerLowsDesc:{zh:"空头趋势中，价格会持续创出更低低点，直到触及 HTF 支撑。",en:"In a bearish trend, price keeps creating lower lows until it reaches HTF support."},bearishLiquidityTitle:{zh:"流动性",en:"LIQUIDITY"},bearishLiquidityDesc:{zh:"考虑流动性后，价格有时会先回破前高，再继续跌破最新低点。",en:"With liquidity in mind, price can rebreak a previous high before breaking the latest low again."},supportResistanceTitle:{zh:"支撑与阻力",en:"SUPPORT & RESISTANCE"},supportResistanceDesc:{zh:"在区间内，价格通常会尊重支撑与阻力位。",en:"Within a range, price respects support and resistance levels."},establishedResistanceTitle:{zh:"已建立阻力",en:"ESTABLISHED RESISTANCE"},establishedResistanceDesc:{zh:"区间顶部的阻力，常由一根看涨蜡烛后接一根看跌蜡烛形成。",en:"Top resistance is often formed by one bullish candle followed by one bearish candle."},establishedSupportTitle:{zh:"已建立支撑",en:"ESTABLISHED SUPPORT"},establishedSupportDesc:{zh:"区间底部支撑，常由一根看跌蜡烛后接一根看涨蜡烛形成。",en:"Bottom support is often formed by one bearish candle followed by one bullish candle."},fakeoutDesc:{zh:"有时会出现假突破，突破区间后又收回区间内部，这同样属于流动性行为。",en:"You may get fakeouts: breakouts from the range followed by closes back into the range. This is also liquidity."},fakeoutExample:{zh:"假突破示例",en:"Fakeout Example"},reactionBasedTitle:{zh:"反应式交易",en:"REACTION BASED TRADING"},reactionBasedDesc:{zh:"不需要提前猜测结构何时变化，只要观察价格反应即可。",en:"We do not need to predict where structure changes, just react to price."},liquidityOrStructureTitle:{zh:"流动性还是结构变化",en:"LIQUIDITY OR STRUCTURE CHANGE"},liquidityOrStructureDesc:{zh:"当趋势中突然出现结构变化时，容易混淆。后续章节会讲清如何区分流动性与真实结构切换。",en:"A sudden shift during trend can be confusing. Advanced concepts explain how to separate liquidity from true structure change."},labelLiquidityLowerHigh:{zh:"流动性与更低高点",en:"LIQUIDITY & LOWER HIGH"},labelBreakPreviousLow:{zh:"跌破前低",en:"BREAK OF PREVIOUS LOW"},labelConfirmLowerLow:{zh:"确认更低低点",en:"CONFIRMED LOWER LOWS"},labelBearContinuation:{zh:"空头结构延续",en:"BEARISH STRUCTURE CONTINUATION"}},it={breakoutsTitle:{zh:"突破",en:"BREAKOUTS"},breakoutsLeadTitle:{zh:"进入下一个区间",en:"INTO THE NEXT RANGE"},breakoutsDescA:{zh:"突破指的是蜡烛收盘在已建立区间的上方或下方，这通常代表有足够动能推动价格进入下一个区间。",en:"Breakouts refer to a candle close above or below an established range, which is usually a good indication of volume."},breakoutsDescB:{zh:"突破可能是延续信号，也可能演变成流动性抓取或假突破。",en:"Breakouts can either confirm continuation in the prior direction, or lead to liquidity and fakeouts."},breakoutsDescC:{zh:"请结合所有时间框架判断更可能发生的路径。",en:"Use all time frames to determine which outcome is more likely."},fakeoutsTitle:{zh:"假突破",en:"FAKEOUTS"},fakeoutsLeadTitle:{zh:"错误方向",en:"THE WRONG WAY"},fakeoutsDescA:{zh:"假突破是指价格先向当前推动方向的反方向突破，随后收回到前一区间，并继续原方向。",en:"A fakeout is a breakout in the opposite direction of current pressure, followed by a close back into the previous range and continuation in the prior direction."},fakeoutsDescB:{zh:"当价格在趋势中推进时，往往需要额外流动性来继续推进，假突破就是常见形式之一。",en:"When price is trending, it may require additional liquidity to continue. Fakeouts are a common form of that process."},fakeoutsDescC:{zh:"务必记住价格推进方向，避免被假突破困在错误仓位。",en:"Remember the direction of travel so you do not get faked out into a losing position."},onionsTitle:{zh:"夹心",en:"ONIONS"},onionsLeadTitle:{zh:"区间内交易",en:"TRADING THE RANGE"},onionsDescA:{zh:"在区间中交易时，需要先建立支撑与阻力（顺序不限），这就是夹心。",en:"When trading in a range, we need price to establish both support and resistance (in any order). We refer to this as an onion."},onionsDescB:{zh:"当两端水平建立后，优先寻找顺着动能方向的区间回补。",en:"Once levels are set, we look for a simple range fill in the direction of momentum."},onionsDescC:{zh:"也可以理解为: 等待更高低点形成，再交易支撑确认到更高高点（多头趋势）。",en:"Alternatively, wait for a higher low to form, then trade support confirmation into a higher high (in a bullish trend)."},advantageTitle:{zh:"优势点位",en:"ADVANTAGE POINTS"},advantageLeadTitle:{zh:"高概率价格行为",en:"HIGH PROBABILITY PRICE ACTION"},advantageDescA:{zh:"基于前序价格行为，我们能预判价格可能触及的区域。突破后，价格通常更容易回补下一个区间。",en:"Based on previous price action, we get clues on where price can tap next. After a breakout, price is likely to fill the next range."},advantageDescB:{zh:"完整区间回补通常是整体止盈目标，因为价格触及该位置的概率较高。",en:"The full range fill is usually our full TP because there is a high probability that price reaches that level."},advantageDescC:{zh:"我们也可以把前一根影线高点突破作为中间优势点，但更希望先看到下影线出现。",en:"A break of a previous wick high can be an intermediate advantage point, but we usually prefer seeing a bottom wick first."},advantageDescD:{zh:"这个下影线提供更强确认: 形成下影后，重新突破高点通常会跟随推进行情。",en:"That bottom wick acts as stronger confirmation: after it forms, a rebreak of highs is usually followed by a push."},previousAction:{zh:"前序价格行为",en:"previous price action"},overallTp:{zh:"整体止盈",en:"OVERALL TP"},advantagePoint:{zh:"优势点位 1",en:"ADVANTAGE POINT 1"},entryPoint:{zh:"入场点",en:"ENTRY POINT"},breakoutConfirmation:{zh:"突破确认",en:"BREAKOUT CONFIRMATION"}},zr={readingTitle:{zh:"倒着读蜡烛",en:"READING CANDLES BACKWARDS"},whyTitle:{zh:"为什么要倒着读蜡烛？",en:"WHY DO WE READ CANDLES BACKWARDS?"},introA:{zh:"倒着读蜡烛，指的是把每一根 HTF 蜡烛拆分成更小时间框架的组成部分，从而在决策和理解价格行为时获得更完整信息。",en:"Reading candles backwards is a phrase we use to describe breaking down each individual HTF candle into its smaller components so that we can be more informed in our decision making and understanding of price action."},introB:{zh:"刚开始，这个方法在日常分析中较难使用，但它是掌握技术分析与价格行为的关键能力。蜡烛会告诉你价格想做什么，我们的任务是从 HTF 到 LTF 拼出完整画面。",en:"At first, this is quite difficult to understand and use in your daily analysis, however, this is a key component of mastering technical analysis and price action. Candles tell you all the information about what price wants to do, and our job is to get a full picture using all the timeframes from HTF to LTF."},pointA:{zh:"A 有时 HTF 看不清区间，但在 LTF 会非常清晰。",en:"A Sometimes ranges can't be seen on the HTF, but is very clear on the LTFs."},pointB:{zh:"B HTF 上已建立的区间，内部通常会包含多个 LTF 区间。",en:"B Established range on the HTF will contain multiple ranges on the LTF."},pointC:{zh:"C 前一根蜡烛的下影线。标准 1H 看涨蜡烛可拆成四根 15M，叙事会完全不同。该 1H 蜡烛内部，价格先抓流动性，为前一根无下影 15M 蜡烛补出下影线。",en:"C Bottom wicks for previous candles. A standard 1H bullish candle can be broken down into four 15M candles where its story can be told in a very different way. Within this 1H candle, price grabbed liquidity and created a bottom wick for a no bottom wick previous 15 minute candle."},pointD:{zh:"D 流动性之后的突破。抓完流动性后，价格再次突破近期高点。此时我们更有信心其继续上行，但仍需突破收盘确认。",en:"D Breakout after liquidity. After grabbing liquidity, price once again breaks above recent highs. This time, we can be more confident that price will continue driving up, but we still need a breakout closure as confirmation."},pointE:{zh:"E 30M 蜡烛为前一根蜡烛补出下影线。",en:"E 30M candle bottom wick for previous candle."},pointF:{zh:"F HTF 图里的假突破通常只是一根影线，只有在 LTF 才能看到全貌。这里可清晰看到假突破形成，提供足够流动性后，价格再破高点并延续多头结构。",en:"F Fakeouts on HTF charts are just wicks, only on the LTFs can you see the full picture. Here you can clearly see a fakeout forming, which is enough liquidity for price to re-break the highs to continue its bullish structure."}},Le={title:{zh:"流动性",en:"LIQUIDITY"},noticing:{zh:"识别市场模式",en:"NOTICING MARKET PATTERNS"},introA:{zh:"最初我们发现自己经常被假突破洗出。随着我们对假突破更有适应性，并在图表中耐心观察后，我们开始追问: 为什么价格会制造假突破？",en:"Initially, we noticed that we were getting faked out relatively often. We adapted to the fakeouts and as we started watching fakeouts happen whilst we were patient on the charts, we asked ourselves: Why does price create fakeouts?"},introB:{zh:"为了解答这个问题，我们开始更关注假突破发生前与发生后的行为变化。",en:"To answer this question, we paid more attention to what happens before and after fakeouts."},beforeTitle:{zh:"假突破之前",en:"BEFORE A FAKEOUT"},beforeDesc:{zh:"价格通常处于区间内，方向不明，且成交量偏低。",en:"Price typically is ranging and has no direction. Often times, there is also less volume in the markets."},afterTitle:{zh:"假突破之后",en:"AFTER A FAKEOUT"},afterDesc:{zh:"价格通常会提速，成交量抬升。有时市场需要更久才选出方向，但多数会落入两种路径。",en:"Price usually picks up more volume and is moving much quicker. It sometimes takes more time for price to choose its direction, but the fakeout usually turns into one of two scenarios:"},afterBulletA:{zh:"1. 延续并重新突破高点/低点",en:"1. Continuation and Rebreak of Highs/Lows"},afterBulletB:{zh:"2. 出现结构切换，在形成顶部/底部影线后反转",en:"2. Market structure shift and a reversal after a top/bottom wick is created"},summary:{zh:"我们围绕假突破的观察最终指向同一个结论: 价格会扫过高点/低点并制造更陡的下影线。这种扫流动性通常会短暂打破前结构点，并在形态上模仿历史价格行为。",en:"Our understanding of price action around the fakeout led us to understand that price sweeps highs/lows and creates steeper bottom wicks. This sweep usually breaks a previous structure point and mimics historic price action."},ranging:{zh:"区间",en:"RANGING"},breakStructure:{zh:"结构破位",en:"BREAK OF STRUCTURE"},continuation:{zh:"延续",en:"CONTINUATION"},entriesTitle:{zh:"入场与流动性",en:"ENTRIES AND LIQUIDITY"},paWithout:{zh:"无流动性的价格行为",en:"PRICE ACTION WITHOUT LIQUIDITY"},riskShiftTitle:{zh:"结构切换风险",en:"RISK OF STRUCTURE SHIFT"},riskShiftDescA:{zh:"如果没有流动性补充，价格更容易出现反转并打破结构。",en:"Without liquidity, there is a higher chance that price will reverse and break structure."},riskShiftDescB:{zh:"价格不会无限同向，回撤始终存在可能。",en:"Price never continues in the same direction infinitely and retracement is always a possibility."},riskShiftDescC:{zh:"因此，市场结构是决定价格能否继续推进的关键前提。",en:"As such, market structure is very important and will largely determine whether or not price has what it needs to continue."},htfView:{zh:"HTF 视图 1H",en:"HTF VIEW 1H"},ltfView:{zh:"LTF 视图 30M",en:"LTF VIEW 30M"},ltfReversal:{zh:"这里很可能是 HTF 的流动性抓取。在 LTF 里，它会看起来像反转与结构切换。",en:"There is a very high chance that this market reversal is a HTF liquidity grab. On the LTF
