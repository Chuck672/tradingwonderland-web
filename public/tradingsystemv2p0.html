（Swing Trading）：低频高质量，适合耐心充足、情绪稳定的交易者","连续 4 周只执行一种风格，不因单日盈亏切换打法"],milestone:"连续 4 周只执行一种风格，不因盈亏情绪切换打法。能明确说出「我的风格是 X，因为 Y」。",details:[{heading:"剥头皮 Scalping",content:"持仓时间从数秒到数分钟。追求小利润高频率。需要低延迟执行环境和极强的纪律性。适合精力充沛、反应快、能承受高频决策压力的交易者。风险在于过度交易和手续费侵蚀。"},{heading:"日内短线 Day Trading",content:"持仓时间从数分钟到数小时，日内了结。需要固定的交易时段和稳定的作息。适合能规律生活、在特定时段高度专注的人。核心挑战是耐心等待和避免在非优势时段强行交易。"},{heading:"波段交易 Swing Trading",content:"持仓时间从数天到数周。交易频率低但对分析质量要求高。适合有耐心、情绪稳定、不急于每天看到结果的交易者。需要更大的止损空间和对回撤的心理承受力。"}],tips:["没有「最好」的风格，只有「最适合你」的风格。","用模拟盘或极小仓位测试不同风格，感受真实心理反应。","如果你发现自己在某种风格下反复破戒，说明不匹配——果断换。","作息不规律时不要选剥头皮或日内，波段可能更安全。"],nextStepHint:"确定风格后，就可以开始搭建你的最小可执行交易系统了。"},{id:3,slug:"system-building",title:"交易系统初养成",subtitle:"Setup + 风控 + 心态约束 = 最小可执行系统",icon:"⎔",duration:"建议周期：1-2 个月",description:"根据选定的交易风格和工具偏好，搭建最小可执行系统。系统包含三个核心模块：入场条件（Setup）、风险控制（Risk）和心态约束（Mental Framework）。",keyActions:["把入场条件、失效条件、止盈规则写成统一清单——每笔交易必须对照执行","固定风险参数：单笔风险（如 1% 账户）和日亏损上限（如 3%），风控优先于信号","设置情绪开关：焦躁时暂停 15 分钟、报复性交易冲动时强制停盘、恐惧时降低仓位","建立交易记录模板，每笔交易标注 Setup 类型和执行评分"],milestone:"每笔交易都能追溯到同一套规则，且能用记录模板完整还原决策过程。不存在「随手做的单」。",details:[{heading:"入场清单（Setup Checklist）",content:"明确定义：什么结构下可以交易？需要哪些确认信号？入场区域在哪？建立 If-Then 规则：「如果 A 条件 + B 确认，则在 C 价位入场，止损 D，目标 E」。"},{heading:"风控框架（Risk Management）",content:"单笔风险不超过账户的 1-2%。设定日亏损上限（例如 3%），触及后强制停盘。永远先确定止损，再计算仓位。风控不是可选项，它是系统的地基。"},{heading:"心态约束协议",content:"制定个人「交易宪法」：连亏 N 笔后暂停、盈利后不加码冒险、特定情绪状态下降频或不交易。把这些规则写下来，贴在交易屏幕旁边。"}],tips:["系统不需要完美，需要可执行。先有框架，再迭代优化。","把规则写在纸上或打印出来——看得见的规则更容易遵守。","初期系统越简单越好，复杂度是后期打磨出来的。"],nextStepHint:"有了系统之后，接下来就是用数据和日记来打磨它。"},{id:4,slug:"system-refinement",title:"交易系统打磨",subtitle:"用交易日记和统计数据驱动系统优化",icon:"⏣",duration:"建议周期：2-3 个月",description:"用交易日记和统计数据打磨系统，而非凭感觉改策略。每一次调整都必须有数据支撑，每次只改一个变量，观察足够样本后再下结论。",keyActions:["交易日记必须包含：市场场景描述、执行偏差记录、下次改进动作","每周复盘核心指标：胜率、盈亏比、数学期望值、最大回撤","每次只调整一个变量（入场、止损、止盈、过滤条件），观察 20-30 笔交易再判断效果","分类统计不同 Setup 的表现，淘汰负期望值的模式"],milestone:"系统出现可重复的正期望值优势，回撤进入可控范围（如最大回撤 < 10%）。数据证明系统有效，而非感觉。",details:[{heading:"交易日记撰写规范",content:"每笔交易记录：日期时间、品种、方向、Setup 类型、入场价/止损价/目标价、实际出场价、盈亏（R 值）、执行评分（1-5）、心态状态、偏差说明、改进 Action。用文字+截图还原当时的决策场景。"},{heading:"周度复盘框架",content:"每周统计：交易次数、胜率、平均盈亏比、期望值（Expectancy = 胜率 × 平均盈利 - 败率 × 平均亏损）、最大单笔亏损、最大回撤、最佳交易（为什么好）、最差交易（为什么差）。"},{heading:"单变量测试法",content:"每次只修改系统的一个参数。例如：把止盈从 2R 改为 3R，然后观察接下来 20-30 笔交易的表现。如果改善则保留，否则回退。避免同时修改多个变量——否则无法归因。"}],tips:["交易日记是你最重要的资产——它比任何指标都有价值。","不要因为连续盈利就跳过复盘，好状态下的数据同样重要。","打磨是耐心活，急于求成反而会破坏已有的正期望值。"],nextStepHint:"当数据证明系统有效时，进入整合阶段——形成你的交易作战手册。"},{id:5,slug:"system-maturity",title:"交易系统初成型",subtitle:"半年内 P/L 持平或微盈利，执行一致性稳定",icon:"⬢",duration:"建议周期：3-6 个月",description:"6 个月内做到 P/L 持平或微盈利，核心不在于赚多少，而在于执行一致性的稳定。从追求完美交易转向追求稳定执行和风险管理优势。",keyActions:["优先评估执行一致性——是否每笔交易都按规则执行，不放大短期收益波动","保留高质量 Setup，主动删除边际信号——只做 A+ 级别的交易机会","形成 1 页交易作战手册，开盘前必读——包含当日偏见、关键价位、操作计划","建立账户管理规则：阶段性出金、风险递增/递减规则"],milestone:"从「寻找圣杯」的心态，转向「稳定执行 + 风险管理」的认知。P/L 曲线开始走平或微微上翘。",details:[{heading:"执行一致性评估",content:"每周计算「规则符合率」：按规则执行的交易 / 总交易数 × 100%。目标 > 90%。偏离规则的交易单独分析原因——是规则不清晰还是情绪失控。"},{heading:"交易作战手册",content:"一页纸浓缩你的整个系统：市场偏见判断方法、入场 Setup 清单（不超过 3 种）、风控参数、心态检查项、开盘前 Routine。每天开盘前读一遍，强化执行意识。"},{heading:"心态转型：从圣杯到边际优势",content:"接受：没有完美系统，只有「略有优势 + 长期执行」。不再寻找 100% 胜率的方法，而是追求「正期望值 × 足够样本 × 一致性执行 = 稳定盈利」。"}],tips:["此阶段的核心 KPI 是执行一致性，而非绝对收益。","微盈利比大盈大亏更有价值——它证明系统可持续。","定期回顾作战手册并更新，但更新频率不超过每月一次。"],nextStepHint:"系统成型后，通过增加过滤条件和场景识别来进一步优化胜率。"},{id:6,slug:"system-optimization",title:"交易系统持续优化",subtitle:"过滤条件 + 场景设置 → 提升胜率，减少无效交易",icon:"⟐",duration:"建议周期：持续进行",description:"通过增加过滤条件和场景识别来提升交易质量。不是做更多交易，而是做更少但更好的交易。每一个过滤器的添加都必须有数据支撑。",keyActions:["增加时段过滤：统计不同时段的胜率和盈亏比，只在优势时间窗口交易","增加环境过滤：区分趋势日和震荡日，使用不同的触发逻辑和目标设定","定义明确的「放弃交易」标准——主动降低低质量出手","追踪「未交易机会」——验证你的过滤器是否误杀了好机会"],milestone:"交易次数明显下降，但质量和稳定性持续上升。每笔交易的平均 R 值提升，情绪波动减少。",details:[{heading:"时段过滤器",content:"统计过去 3 个月的交易数据，按小时分组计算胜率和盈亏比。例如：发现亚洲时段胜率 35% 而伦敦开盘后胜率 55%，则考虑只在伦敦+纽约时段交易。省略低优势时段 = 直接提升整体表现。"},{heading:"市场环境识别",content:"学习区分：趋势日（大单边）、区间日（来回震荡）、扩张日（波动突然放大）。不同环境用不同策略参数：趋势日追踪止盈、区间日固定目标、扩张日提前收窄止损或观望。"},{heading:"主动放弃的艺术",content:"定义「不做」清单比「做」清单更重要。例如：重大数据前后 30 分钟不做、连亏 2 笔后暂停 1 小时、结构不清晰时不做。最好的交易往往是没做的那些烂交易。"}],tips:["每增加一个过滤器，记录其对系统表现的影响（交易次数、胜率、盈亏比变化）。","过滤器不是越多越好——过度优化会导致实盘无交易可做。","保持「未做清单」——记录你主动放弃的机会，定期验证放弃是否正确。"],nextStepHint:"优化到位后，最后一步是将整个系统机械化，用流程替代情绪。"},{id:7,slug:"mechanical-execution",title:"机械化执行",subtitle:"用纪律替代情绪，用流程替代状态",icon:"⎈",duration:"建议周期：终身修炼",description:"把经过验证的系统固化为标准流程，用纪律和流程替代情绪驱动。交易不再依赖「状态好不好」，而是依赖「流程是否正确执行」。这是可持续盈利交易者的终极形态。",keyActions:["持续记录失效案例，建设个人「错误模式库」——同样的错误不犯第二次","每周一次复盘会，只跟踪执行偏差与改进行动的落地情况","定期阅读交易心理学书籍（如《交易心理分析》《自律的交易者》）并输出读书摘要","建立交易 SOP（标准操作流程）：开盘前、盘中、收盘后各阶段的标准动作"],milestone:"不再依赖「今天状态好」来盈利，而是依赖「流程正确执行」来保持稳定。交易变成一份可重复的工作，而非赌博。",details:[{heading:"错误模式库",content:"记录每一次偏离系统的行为：何时、何种情绪、导致什么后果、如何预防。分类整理为常见模式：追单、报复交易、提前止盈、移动止损到成本、过度交易。定期回顾，形成条件反射般的自我觉察。"},{heading:"标准操作流程（SOP）",content:"开盘前（30min）：检查日历事件、标注关键价位、写交易计划、心态自检。盘中：只执行计划内的 Setup、每笔交易实时记录、触及日亏上限立即停盘。收盘后（15min）：更新交易日记、标注偏差、写明天准备。"},{heading:"交易心理学持续学习",content:"推荐书单：Mark Douglas《交易心理分析》、Brett Steenbarger《交易心理学》、Jared Tendler《The Mental Game of Trading》。每月读一本或重读经典，输出 3-5 条核心 Takeaway 并融入你的交易宪法。"}],tips:["机械化 ≠ 无脑。它是「高度自觉 + 严格执行」的结合。","允许系统有亏损期——这是正常的。信任过程，不信任单笔结果。","把交易当作马拉松而非短跑——一致性和持久性才是终极优势。","定期与其他认真的交易者交流——孤独的交易者容易偏航。"],nextStepHint:"恭喜你完成了整个成长路径的学习。记住：交易是一场终身修炼，保持谦逊，持续进化。"}];function Vv(){const c=fi(),[o,d]=R.useState([]),[r,m]=R.useState(!1);return R.useEffect(()=>{m(!0);const h=[];return ze.forEach((p,A)=>{h.push(setTimeout(()=>{d(b=>[...b,A])},400+A*180))}),()=>h.forEach(clearTimeout)},[]),s.jsxs("div",{className:"min-h-screen bg-dark-bg grid-bg relative overflow-hidden",children:[s.jsx("div",{className:"pointer-events-none fixed inset-0 z-50",children:s.jsx("div",{className:"absolute inset-0 opacity-[0.03]",style:{backgroundImage:"repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,65,0.1) 2px, rgba(0,255,65,0.1) 4px)"}})}),s.jsx("div",{className:"pointer-events-none fixed inset-0 z-0",children:Array.from({length:20}).map((h,p)=>s.jsx("div",{className:"absolute rounded-full bg-matrix-green",style:{
